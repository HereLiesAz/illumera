# The web app on Cloudflare Workers: dist/ as static assets, worker/index.ts for /api.
name = "illumera-web"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
# TRAKT_CLIENT_ID is set in the Cloudflare dashboard; keep it across deploys.
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /api must reach the Worker, not fall back to index.html.
run_worker_first = ["/api/*"]
