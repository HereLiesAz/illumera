name: Temporary addon catalog UI patch

on:
  push:
    branches:
      - feature/stremio-addon-catalog
    paths:
      - ".github/workflows/temp-addon-catalog-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout illumera
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Patch addon manager
        run: python .ci/patch-addon-catalog-ui.py

      - name: Commit UI integration
        run: |
          rm .ci/patch-addon-catalog-ui.py
          rmdir .ci 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/hereliesaz/illumera/ui/addons/AddonsScreen.kt .ci
          git diff --cached --check
          git commit -m "Expose Stremio addon catalogs in addon manager"
          git push origin HEAD:feature/stremio-addon-catalog
