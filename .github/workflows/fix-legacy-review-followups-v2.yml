          p.write_text(text)
          PY
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java docs/PLAY_STORE.md
          git diff --cached --check
          git commit -m "Address legacy PR review findings"
          git push origin HEAD:fix/legacy-pr-review-followups
