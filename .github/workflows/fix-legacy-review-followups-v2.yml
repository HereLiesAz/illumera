name: Fix legacy PR review followups v2

on:
  push:
    branches: [fix/legacy-pr-review-followups]
    paths: [.github/workflows/fix-legacy-review-followups-v2.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub(path, pattern, repl, flags=0, count=1):
              p=Path(path); text=p.read_text(); new,n=re.subn(pattern,repl,text,count=count,flags=flags)
              if n != count: raise SystemExit(f'{path}: expected {count} match(es), got {n}: {pattern[:100]}')
              p.write_text(new)

          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text()
              if text.count(old) < count: raise SystemExit(f'{path}: missing {old[:100]!r}')
              p.write_text(text.replace(old,new,count))

