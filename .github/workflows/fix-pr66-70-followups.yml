name: Fix PR 66-70 review followups

on:
  push:
    branches:
      - fix/pr66-70-review-followups
    paths:
      - .github/workflows/fix-pr66-70-followups.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply player review fixes
        shell: bash
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/hereliesaz/illumera/ui/player/base/ExoPlayerBackend.kt app/src/main/java/com/hereliesaz/illumera/ui/player/PlayerScreen.kt app/src/main/java/com/hereliesaz/illumera/MainActivity.kt app/src/main/java/com/hereliesaz/illumera/ui/player/base/BasePlayerScaffold.kt
          git diff --cached --check
          git commit -m "Address player review findings from PRs 69 and 70"
          git push origin HEAD:fix/pr66-70-review-followups
