name: Apply device-aware auth v2

on:
  push:
    branches:
      - feature/device-aware-auth
    paths:
      - .github/scripts/device_auth_patch.py
      - .github/workflows/apply-device-aware-auth-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/device_auth_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/hereliesaz/illumera/ui/settings/IntegrationsScreen.kt
          git diff --cached --check
          git commit -m "Make integration auth device-aware"
          git push origin HEAD:feature/device-aware-auth
