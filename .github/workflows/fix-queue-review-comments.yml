name: Fix queue review comments

on:
  push:
    branches:
      - feature/queue-suggestion-management
    paths:
      - .github/workflows/fix-queue-review-comments.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/hereliesaz/illumera/data/queue/QueueManager.kt app/src/main/java/com/hereliesaz/illumera/ui/queue/QueueScreen.kt app/src/main/java/com/hereliesaz/illumera/ui/home/LumeraCard.kt
          git diff --cached --check
          git commit -m "Address queue suggestion review comments"
          git push origin HEAD:feature/queue-suggestion-management
