name: Legacy Glee PR Review (Claude)

# Legacy adversarial review retained for optional manual comparison.
# Jules is the canonical Glee implementation and the only automatic PR reviewer.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  glee-review:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve trusted base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          BASE_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefOid --jq .baseRefOid)
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Legacy Glee adversarial review (Claude)
        uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636 # v1.0.217
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pr_number }}

            This is a legacy/manual comparison reviewer, not the canonical Glee agent.
            Audit the pull request adversarially for concrete correctness failures,
            unsupported claims, and materially important missing tests. Verify every
            finding against the surrounding code. The workspace contains only the
            trusted base revision; inspect the PR using `gh pr diff` and `gh pr view`.
            Do not execute PR code. Do not approve, merge, or push commits.

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for specific findings and `gh pr comment` for at most
            one closing summary.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
