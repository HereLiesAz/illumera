name: Temporary corrected release dispatch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-dispatch-release.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
