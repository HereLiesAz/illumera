name: Fix legacy PR review followups v4

on:
  push:
    branches:
      - fix/legacy-pr-review-followups
    paths:
      - .github/workflows/fix-legacy-review-followups-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: python3 .github/scripts/run_legacy_review_patch.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java docs/PLAY_STORE.md
          git diff --cached --check
          git commit -m "Address legacy PR review findings"
          git push origin HEAD:fix/legacy-pr-review-followups
