name: Temporary initial setup fix

on:
  push:
    branches:
      - fix/initial-setup-userflow
    paths:
      - ".ci/apply-initial-setup-fix.py"
      - ".github/workflows/temp-apply-initial-setup-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/initial-setup-userflow
          fetch-depth: 0

      - name: Apply setup flow fixes
        run: |
          set -euo pipefail
          if [ -f .ci/apply-initial-setup-fix.py ]; then
            python .ci/apply-initial-setup-fix.py
          else
            echo "Setup transformer already consumed; nothing to apply."
          fi

      - name: Commit source changes
        run: |
          set -euo pipefail
          rm -f .ci/apply-initial-setup-fix.py
          rmdir .ci 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test README.md docs/ARCHITECTURE.md .ci
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Fix initial setup login, avatar, and logout flow"
          git push origin HEAD:fix/initial-setup-userflow
