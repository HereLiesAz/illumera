name: Temporary recent review cleanup

on:
  push:
    branches:
      - production-hardening
    paths:
      - ".github/workflows/temp-recent-review-fixes.yml"

permissions:
  contents: write

jobs:
  patch-compile-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STREMIO_MEDIA_REF: 95781597c8e3c30d6232e77bdadecc38ad35aa17
      STREMIO_AAR_CACHE_VERSION: v2
    steps:
      - name: Checkout current hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production-hardening
          path: illumera
          fetch-depth: 0

      - name: Restore Stremio playback AAR cache
        id: stremio-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: stremio-aars
          key: stremio-media-${{ runner.os }}-${{ env.STREMIO_MEDIA_REF }}-${{ env.STREMIO_AAR_CACHE_VERSION }}

      - name: Checkout Stremio Media3 fork
        if: steps.stremio-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Stremio/media
          ref: ${{ env.STREMIO_MEDIA_REF }}
          path: stremio-media
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Build Stremio playback modules
        if: steps.stremio-cache.outputs.cache-hit != 'true'
        working-directory: illumera
        run: |
          chmod +x ci/build-stremio-media.sh
          ./ci/build-stremio-media.sh ../stremio-media ../stremio-aars

      - name: Install Stremio playback modules
        working-directory: illumera
        run: |
          set -euo pipefail
          for aar in \
            lib-exoplayer-release.aar \
            lib-decoder-av1-release.aar \
            lib-decoder-ffmpeg-release.aar \
            lib-decoder-iamf-release.aar \
            lib-decoder-mpegh-release.aar; do
            test -s "../stremio-aars/$aar" || { echo "Missing Stremio playback artifact: $aar" >&2; exit 1; }
            cp "../stremio-aars/$aar" "playbackcore/libs/$aar"
          done

      - name: Apply still-relevant PR review fixes
        working-directory: illumera
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('.ci/apply-recent-review-fixes.py')
          s = p.read_text()

          old_once = '''def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected exactly one occurrence, found {count}: {old[:100]!r}")
              write(path, text.replace(old, new, 1))
          '''
          new_once = '''def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count == 1:
                  write(path, text.replace(old, new, 1))
                  return
              if count == 0:
                  return
              raise RuntimeError(f"{path}: ambiguous occurrence count {count}: {old[:100]!r}")
          '''
          if old_once not in s:
              raise SystemExit('replace_once helper shape changed')
          s = s.replace(old_once, new_once, 1)

          old_exact = '''def replace_exact_count(path: str, old: str, new: str, expected: int) -> None:
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f"{path}: expected {expected} occurrences, found {count}: {old[:100]!r}")
              write(path, text.replace(old, new))
          '''
          new_exact = '''def replace_exact_count(path: str, old: str, new: str, expected: int) -> None:
              text = read(path)
              count = text.count(old)
              if count == expected:
                  write(path, text.replace(old, new))
                  return
              if count == 0:
                  return
              raise RuntimeError(f"{path}: ambiguous occurrence count {count}: {old[:100]!r}")
          '''
          if old_exact not in s:
              raise SystemExit('replace_exact_count helper shape changed')
          s = s.replace(old_exact, new_exact, 1)

          broad = '    text = text.replace("# v4\\n", "# v7.0.1\\n") if "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4" in text else text\n'
          s = s.replace(broad, '')
          old = "'''                modifier = Modifier\n                    .width(rememberDialogWidth(460))"
          new = "'''            Box(\n                modifier = Modifier\n                    .width(rememberDialogWidth(460))"
          s = s.replace(old, new)
          p.write_text(s)
          PY
          python .ci/apply-recent-review-fixes.py

      - name: Harden credential storage
        working-directory: illumera
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/hereliesaz/illumera/data/auth/StremioAuthManager.kt')
          s = path.read_text()

          old = '''    private val encryptedPrefs: SharedPreferences by lazy {
              try {
                  createEncryptedPrefs()
              } catch (e: Exception) {
                  // AEADBadTagException / KeyStore corruption — nuke and rebuild
                  Log.e("StremioAuthManager", "EncryptedSharedPreferences corrupted, resetting", e)
                  clearCorruptedPrefs()
                  try {
                      createEncryptedPrefs()
                  } catch (e2: Exception) {
                      // KeyStore is permanently broken on this device — fall back to plain prefs
                      Log.e("StremioAuthManager", "KeyStore permanently broken, using plain prefs", e2)
                      context.getSharedPreferences(PREFS_FILE + "_fallback", Context.MODE_PRIVATE)
                  }
              }
          }
          '''
          new = '''    @Volatile
              private var secureStorageAvailable = true

              private val encryptedPrefs: SharedPreferences by lazy {
                  try {
                      createEncryptedPrefs()
                  } catch (e: Exception) {
                      // Recover once from a corrupt encrypted preference/key pair.
                      Log.e("StremioAuthManager", "EncryptedSharedPreferences corrupted, resetting", e)
                      clearCorruptedPrefs()
                      try {
                          createEncryptedPrefs()
                      } catch (e2: Exception) {
                          // Never persist account credentials unencrypted. The empty fallback
                          // only keeps read/clear paths non-crashing while login is disabled.
                          Log.e("StremioAuthManager", "Secure credential storage unavailable", e2)
                          secureStorageAvailable = false
                          context.getSharedPreferences(PREFS_FILE + "_fallback", Context.MODE_PRIVATE)
                              .also { it.edit().clear().apply() }
                      }
                  }
              }
          '''
          if old not in s:
              raise SystemExit('Encrypted preference fallback block changed unexpectedly')
          s = s.replace(old, new, 1)

          old = '''        return EncryptedSharedPreferences.create(
              context,
              PREFS_FILE,
              masterKey,
              EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
              EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
          )
          '''
          new = '''        val prefs = EncryptedSharedPreferences.create(
              context,
              PREFS_FILE,
              masterKey,
              EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
              EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
          )
          // Purge any plaintext credentials left by older fail-open builds.
          context.getSharedPreferences(PREFS_FILE + "_fallback", Context.MODE_PRIVATE)
              .edit()
              .clear()
              .apply()
          return prefs
          '''
          if old not in s:
              raise SystemExit('EncryptedSharedPreferences creation block changed unexpectedly')
          s = s.replace(old, new, 1)

          anchor = '''    private val _connectionState = MutableStateFlow<StremioConnectionState>(StremioConnectionState.Disconnected)
          '''
          helper = '''    private fun secureStorageReady(): Boolean {
              encryptedPrefs // force lazy initialization before checking the flag
              return secureStorageAvailable
          }

              private fun secureStorageFailure(): Result<String> = Result.failure(
                  StremioAuthError.UnknownError("Secure credential storage is unavailable on this device")
              )

          ''' + anchor
          if anchor not in s:
              raise SystemExit('Connection state anchor changed unexpectedly')
          s = s.replace(anchor, helper, 1)

          replacements = {
              '''    suspend fun login(email: String, password: String): Result<String> = withContext(Dispatchers.IO) {
              try {
          ''': '''    suspend fun login(email: String, password: String): Result<String> = withContext(Dispatchers.IO) {
              if (!secureStorageReady()) return@withContext secureStorageFailure()
              try {
          ''',
              '''    ): Result<String> = withContext(Dispatchers.IO) {
              try {
                  val loginResult = stremioAuthService.register(email, password, marketing)
          ''': '''    ): Result<String> = withContext(Dispatchers.IO) {
              if (!secureStorageReady()) return@withContext secureStorageFailure()
              try {
                  val loginResult = stremioAuthService.register(email, password, marketing)
          ''',
              '''    suspend fun completeFacebookLogin(state: String): Result<String> = withContext(Dispatchers.IO) {
              try {
          ''': '''    suspend fun completeFacebookLogin(state: String): Result<String> = withContext(Dispatchers.IO) {
              if (!secureStorageReady()) return@withContext secureStorageFailure()
              try {
          ''',
              '''    suspend fun completeAppleLogin(state: String): Result<String> = withContext(Dispatchers.IO) {
              try {
          ''': '''    suspend fun completeAppleLogin(state: String): Result<String> = withContext(Dispatchers.IO) {
              if (!secureStorageReady()) return@withContext secureStorageFailure()
              try {
          ''',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Auth write guard anchor changed: {old[:70]!r}')
              s = s.replace(old, new, 1)

          path.write_text(s)

          service = Path('app/src/main/java/com/hereliesaz/illumera/data/remote/StremioAuthService.kt')
          text = service.read_text()
          if 'pollFacebookLogin(state: String, maxAttempts: Int = 25)' in text:
              text = text.replace(
                  'pollFacebookLogin(state: String, maxAttempts: Int = 25)',
                  'pollFacebookLogin(state: String, maxAttempts: Int = 300)',
                  1,
              )
          if 'pollFacebookLogin(state: String, maxAttempts: Int = 300)' not in text:
              raise SystemExit('Facebook polling timeout was not hardened')
          service.write_text(text)
          PY

      - name: Run production quality gate
        working-directory: illumera
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug --no-daemon --stacktrace

      - name: Commit validated hardening
        working-directory: illumera
        env:
          BRANCH: production-hardening
        run: |
          set -euo pipefail
          rm -f .ci/apply-recent-review-fixes.py
          rm -f .github/workflows/temp-recent-review-fixes.yml
          rmdir .ci 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish production hardening and reviewed fixes"
          git push origin "HEAD:$BRANCH"
