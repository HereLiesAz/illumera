name: Temporary production hardening gate

on:
  push:
    branches:
      - production-hardening
    paths:
      - ".github/workflows/temp-recent-review-fixes.yml"

permissions:
  contents: write

jobs:
  harden-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STREMIO_MEDIA_REF: 95781597c8e3c30d6232e77bdadecc38ad35aa17
      STREMIO_AAR_CACHE_VERSION: v2
    steps:
      - name: Checkout current hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: production-hardening
          path: illumera
          fetch-depth: 0

      - name: Restore Stremio playback AAR cache
        id: stremio-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: stremio-aars
          key: stremio-media-${{ runner.os }}-${{ env.STREMIO_MEDIA_REF }}-${{ env.STREMIO_AAR_CACHE_VERSION }}

      - name: Checkout Stremio Media3 fork
        if: steps.stremio-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Stremio/media
          ref: ${{ env.STREMIO_MEDIA_REF }}
          path: stremio-media
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Build Stremio playback modules
        if: steps.stremio-cache.outputs.cache-hit != 'true'
        working-directory: illumera
        run: |
          chmod +x ci/build-stremio-media.sh
          ./ci/build-stremio-media.sh ../stremio-media ../stremio-aars

      - name: Install Stremio playback modules
        working-directory: illumera
        run: |
          set -euo pipefail
          for aar in lib-exoplayer-release.aar lib-decoder-av1-release.aar lib-decoder-ffmpeg-release.aar lib-decoder-iamf-release.aar lib-decoder-mpegh-release.aar; do
            test -s "../stremio-aars/$aar"
            cp "../stremio-aars/$aar" "playbackcore/libs/$aar"
          done

      - name: Apply direct production hardening
        working-directory: illumera
        run: |
          python .ci/repair-hardening-transformer.py
          python .ci/finish-production-hardening.py

      - name: Run production quality gate
        working-directory: illumera
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug --no-daemon --stacktrace

      - name: Commit validated hardening
        working-directory: illumera
        run: |
          set -euo pipefail
          rm -f .ci/apply-recent-review-fixes.py .ci/finalize-hardening.py .ci/prune-review-patcher.py .ci/finish-production-hardening.py .ci/repair-hardening-transformer.py
          rm -f .github/workflows/temp-recent-review-fixes.yml
          rmdir .ci 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish production hardening and reviewed fixes"
          git push origin HEAD:production-hardening
