name: Fix Home watched-title filtering

on:
  push:
    branches:
      - fix/source-language-seedless-watchlist-nav

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-language-seedless-watchlist-nav
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply patch
        run: python3 .ci/fix-home-hide-watched.py
      - name: Compile app
        run: ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Commit app changes
        run: |
          rm -f .ci/fix-home-hide-watched.py .github/workflows/fix-home-hide-watched.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Home watched-title filtering"
          git push origin HEAD:fix/source-language-seedless-watchlist-nav
