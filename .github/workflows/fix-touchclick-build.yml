name: Fix touchClick build

on:
  push:
    branches: [fix/touchclick-build]
    paths: [.github/workflows/fix-touchclick-build.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply build fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'app/src/main/java/com/hereliesaz/illumera/ui/home/HeroCarousel.kt': (
                  '.touchClick { onItemClick(items[safeCurrentIndex]) }',
                  '.touchClick(onClick = { onItemClick(items[safeCurrentIndex]) })'
              ),
              'app/src/main/java/com/hereliesaz/illumera/ui/navigation/NavDrawer.kt': (
                  '.touchClick { onNavigate(screen) }',
                  '.touchClick(onClick = { onNavigate(screen) })'
              ),
          }
          for path, (old, new) in replacements.items():
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected pattern in {path}')
              p.write_text(text.replace(old, new, 1))

          db = Path('app/src/main/java/com/hereliesaz/illumera/data/local/LumeraDatabase.kt')
          text = db.read_text()
          old = '    version = 47\n)'
          new = '    version = 47,\n    exportSchema = false\n)'
          if old not in text:
              raise SystemExit('Missing Room database annotation pattern')
          db.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java
          git diff --cached --check
          git commit -m "Fix touchClick call sites and Room schema warning"
          git push origin HEAD:fix/touchclick-build
