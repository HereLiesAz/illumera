name: Temporary Stremio addon integration cleanup

on:
  push:
    branches:
      - feature/stremio-addon-ui
    paths:
      - ".ci/apply-stremio-addon-integrations.py"
      - ".github/workflows/temp-apply-stremio-addon-integration.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/stremio-addon-ui
          fetch-depth: 0

      - name: Apply Integrations cleanup
        run: |
          set -euo pipefail
          if [ -f .ci/apply-stremio-addon-integrations.py ]; then
            python .ci/apply-stremio-addon-integrations.py
          else
            echo "Transformer already consumed."
          fi

      - name: Commit source changes
        run: |
          set -euo pipefail
          rm -f .ci/apply-stremio-addon-integrations.py
          rmdir .ci 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main .ci
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Route all addon management through Stremio UI"
          git push origin HEAD:feature/stremio-addon-ui
