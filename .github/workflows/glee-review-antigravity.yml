name: Legacy Glee PR Review (Antigravity)

# Legacy/manual comparison reviewer. Jules is the canonical Glee implementation
# and the only Glee workflow that runs automatically for pull requests.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

concurrency:
  group: "legacy-glee-antigravity-${{ inputs.pr_number || github.ref_name }}"
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  glee-review-antigravity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve trusted base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          BASE_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefOid --jq .baseRefOid)
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Legacy Glee adversarial review (Antigravity)
        uses: rsamborski/run-agy-sdk@4ea5c37792310d5f5f4ac96e77e35c510ddd23ce
        with:
          api-key: ${{ secrets.ANTIGRAVITY_API_KEY }}
          mode: review
          prompt: "/antigravity-review"
          trust-workspace: "false"
          sandbox-profile: "true"
          additional_context: |
            This is a legacy/manual comparison reviewer, not the canonical Glee agent.
            Review pull request #${{ inputs.pr_number }} adversarially. Prioritize concrete
            correctness failures, unsupported claims, and materially important missing
            tests. The workspace contains only the trusted base revision. Inspect PR
            changes through GitHub; do not execute, source, build, merge, approve, or
            push code from the pull request.
