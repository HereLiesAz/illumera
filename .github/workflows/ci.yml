name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "ci/README.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STREMIO_MEDIA_REF: 95781597c8e3c30d6232e77bdadecc38ad35aa17
      STREMIO_AAR_CACHE_VERSION: v2
    steps:
      - name: Checkout illumera
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: illumera
          fetch-depth: 0
          persist-credentials: false

      # PR code may consume but never populate the cache used by privileged release jobs.
      - name: Restore Stremio playback AAR cache
        id: stremio-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: stremio-aars
          key: stremio-media-${{ runner.os }}-${{ env.STREMIO_MEDIA_REF }}-${{ env.STREMIO_AAR_CACHE_VERSION }}

      - name: Checkout Stremio Media3 fork
        if: steps.stremio-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Stremio/media
          ref: ${{ env.STREMIO_MEDIA_REF }}
          path: stremio-media
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Build Stremio playback modules
        if: steps.stremio-cache.outputs.cache-hit != 'true'
        working-directory: illumera
        run: |
          chmod +x ci/build-stremio-media.sh
          ./ci/build-stremio-media.sh ../stremio-media ../stremio-aars

      - name: Install Stremio playback modules
        working-directory: illumera
        run: |
          set -euo pipefail
          for aar in \
            lib-exoplayer-release.aar \
            lib-decoder-av1-release.aar \
            lib-decoder-ffmpeg-release.aar \
            lib-decoder-iamf-release.aar \
            lib-decoder-mpegh-release.aar; do
            test -s "../stremio-aars/$aar" || { echo "Missing Stremio playback artifact: $aar" >&2; exit 1; }
            cp "../stremio-aars/$aar" "playbackcore/libs/$aar"
          done

      - name: Test, lint, and assemble
        working-directory: illumera
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
