name: CI

# Builds a debug APK on every pull request targeting main — the release
# workflow (release.yml) only runs after a push lands on main, so without
# this, a compile break went unnoticed until it broke the next release.
# No secrets are required: TRAKT_CLIENT_ID/ACRA_URL/etc. all default to an
# empty string via app/build.gradle.kts when unset (see ci/README.md), and
# the debug build type uses Android's standard debug signing.
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "ci/README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    env:
      STREMIO_MEDIA_REF: 95781597c8e3c30d6232e77bdadecc38ad35aa17
      STREMIO_AAR_CACHE_VERSION: v2
    steps:
      - name: Checkout illumera
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: illumera
          fetch-depth: 0
          persist-credentials: false

      # PR code must never be allowed to populate a cache later consumed by
      # privileged release jobs. Restore the trusted main-branch cache only;
      # this workflow intentionally never saves it.
      - name: Restore Stremio playback AAR cache
        id: stremio-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: stremio-aars
          key: stremio-media-${{ runner.os }}-${{ env.STREMIO_MEDIA_REF }}-${{ env.STREMIO_AAR_CACHE_VERSION }}

      - name: Checkout Stremio Media3 fork
        if: steps.stremio-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Stremio/media
          ref: 95781597c8e3c30d6232e77bdadecc38ad35aa17
          path: stremio-media
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Build Stremio playback modules
        if: steps.stremio-cache.outputs.cache-hit != 'true'
        working-directory: illumera
        run: |
          chmod +x ci/build-stremio-media.sh
          ./ci/build-stremio-media.sh ../stremio-media ../stremio-aars

      - name: Install Stremio playback modules
        working-directory: illumera
        run: |
          set -euo pipefail
          for aar in \
            lib-exoplayer-release.aar \
            lib-decoder-av1-release.aar \
            lib-decoder-ffmpeg-release.aar \
            lib-decoder-iamf-release.aar \
            lib-decoder-mpegh-release.aar; do
            if [ ! -s "../stremio-aars/$aar" ]; then
              echo "Missing Stremio playback artifact: $aar" >&2
              exit 1
            fi
            cp "../stremio-aars/$aar" "playbackcore/libs/$aar"
          done

      - name: Grant execute permission for gradlew
        working-directory: illumera
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: illumera
        run: ./gradlew :app:assembleDebug --no-daemon
