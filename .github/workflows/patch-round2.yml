name: Apply round 2 UI fixes

on:
  push:
    branches:
      - fix/source-language-seedless-watchlist-nav

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-language-seedless-watchlist-nav
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.ci/patch-round2.py')
          text = p.read_text()
          old = '''replace_once(
    "app/src/main/java/com/hereliesaz/illumera/ui/home/HomeScreen.kt",
    "                    state = state,\\n",
    "                    state = displayState,\\n"
)
'''
          new = '''replace_once(
    "app/src/main/java/com/hereliesaz/illumera/ui/home/HomeScreen.kt",
    "                    infoTopPadding = infoTopPadding,\\n                    startPadding = startPadding,\\n                    isTopNav = isTopNav,\\n                    state = state,\\n",
    "                    infoTopPadding = infoTopPadding,\\n                    startPadding = startPadding,\\n                    isTopNav = isTopNav,\\n                    state = displayState,\\n"
)
'''
          if old not in text:
              raise SystemExit('round2 prepatch target not found')
          p.write_text(text.replace(old, new, 1))
          PY
          python3 .ci/patch-round2.py
      - name: Compile app
        run: ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Commit app changes
        run: |
          rm -f .ci/patch-round2.py .github/workflows/patch-round2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add card actions, player next controls, and queue UX fixes"
          git push origin HEAD:fix/source-language-seedless-watchlist-nav
