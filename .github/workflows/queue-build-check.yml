name: Queue build check

on:
  push:
    branches:
      - feature/queue-lineup
    paths:
      - .github/workflows/queue-build-check.yml

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    env:
      STREMIO_MEDIA_REF: 95781597c8e3c30d6232e77bdadecc38ad35aa17
      STREMIO_AAR_CACHE_VERSION: v2
    steps:
      - name: Checkout illumera
        uses: actions/checkout@v4
        with:
          ref: feature/queue-lineup
          path: illumera
          fetch-depth: 0
      - name: Apply source intelligence patch
        working-directory: illumera
        run: python3 tools/apply_source_intelligence.py
      - name: Commit source intelligence integration
        working-directory: illumera
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/hereliesaz/illumera
          if ! git diff --cached --quiet; then
            git commit -m "Integrate intelligent source fallback"
            git push origin HEAD:feature/queue-lineup
          fi
      - name: Restore Stremio playback AAR cache
        id: stremio-cache
        uses: actions/cache@v4
        with:
          path: stremio-aars
          key: stremio-media-${{ runner.os }}-${{ env.STREMIO_MEDIA_REF }}-${{ env.STREMIO_AAR_CACHE_VERSION }}
      - name: Checkout Stremio Media3 fork
        if: steps.stremio-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: Stremio/media
          ref: ${{ env.STREMIO_MEDIA_REF }}
          path: stremio-media
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Stremio playback modules
        if: steps.stremio-cache.outputs.cache-hit != 'true'
        working-directory: illumera
        run: |
          chmod +x ci/build-stremio-media.sh
          ./ci/build-stremio-media.sh ../stremio-media ../stremio-aars
      - name: Install Stremio playback modules
        working-directory: illumera
        run: |
          set -euo pipefail
          for aar in lib-exoplayer-release.aar lib-decoder-av1-release.aar lib-decoder-ffmpeg-release.aar lib-decoder-iamf-release.aar lib-decoder-mpegh-release.aar; do
            test -s "../stremio-aars/$aar"
            cp "../stremio-aars/$aar" "playbackcore/libs/$aar"
          done
      - name: Build debug APK
        working-directory: illumera
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
