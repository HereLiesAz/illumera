name: Remove cleartext debrid pairing v2

on:
  push:
    branches:
      - fix/secure-debrid-tv-pairing
    paths:
      - .github/workflows/remove-cleartext-debrid-pairing-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply secure TV debrid change
        run: python3 .github/scripts/remove_cleartext_debrid_pairing.py
      - name: Remove obsolete LAN pairing implementation
        run: |
          git rm app/src/main/java/com/hereliesaz/illumera/remote_input/DebridPairingServer.kt
          git rm app/src/main/java/com/hereliesaz/illumera/remote_input/DebridPairingServerManager.kt
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/hereliesaz/illumera/ui/settings/IntegrationsScreen.kt
          git commit -m "Remove cleartext debrid API key handoff"
          git push
