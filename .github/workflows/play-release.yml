# Mirrors the central release run into this repository's Actions tab.
#
# Releases are built and published by HereLiesAz/workflows
# (.github/workflows/android-play-release.yml): a push to main reaches its gateway via
# webhook, and that run publishes to Google Play and GitHub Releases. This workflow
# does not build or dispatch anything; it finds that run through the commit status it
# posts on the pushed commit, follows it live, and ends with its result.
#
# It reads the push event from $GITHUB_EVENT_PATH, which also keeps the central sync
# from converting this file into a dispatching proxy (that would release twice).
name: Release (Google Play + GitHub)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
  actions: read
concurrency:
  group: play-release-mirror-${{ github.sha }}
jobs:
  follow:
    name: Follow central release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      CENTRAL_REPO: HereLiesAz/workflows
      STATUS_CONTEXT: .github/workflows/release.yml
    steps:
      - name: Find the central release run
        id: find
        shell: bash
        run: |
          set -euo pipefail
          sha="$(jq -r '.after // empty' "$GITHUB_EVENT_PATH")"
          sha="${sha:-$GITHUB_SHA}"
          echo "Commit: $sha"
          # The central run posts a status on the released commit, linking itself. A
          # manual run starts at main's head, which is usually the bot's "[skip ci]"
          # version commit, so look back a few commits for the latest release.
          for _ in $(seq 1 60); do
            url=""
            for c in $(gh api "repos/$GITHUB_REPOSITORY/commits?sha=$sha&per_page=5" --jq '.[].sha'); do
              url="$(gh api "repos/$GITHUB_REPOSITORY/commits/$c/statuses" \
                --jq "[.[] | select(.context == \"$STATUS_CONTEXT\")][0].target_url // empty")"
              [[ -n "$url" ]] && break
            done
            run_id="$(sed -nE "s#.*/$CENTRAL_REPO/actions/runs/([0-9]+).*#\1#p" <<<"$url")"
            if [[ -n "$run_id" ]]; then
              echo "Central run: $url"
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "::error::No central release run reported on $sha within 30 minutes."
          exit 1

      - name: Follow it to Google Play and GitHub Releases
        shell: bash
        env:
          RUN_ID: ${{ steps.find.outputs.run_id }}
          RUN_URL: ${{ steps.find.outputs.url }}
        run: |
          set -euo pipefail
          seen=""
          while :; do
            run="$(gh api "repos/$CENTRAL_REPO/actions/runs/$RUN_ID")"
            jobs="$(gh api "repos/$CENTRAL_REPO/actions/runs/$RUN_ID/jobs?per_page=100")"
            # Print each step once, as it finishes.
            while IFS= read -r line; do
              grep -qxF "$line" <<<"$seen" || { echo "$line"; seen+="$line"$'\n'; }
            done < <(jq -r '.jobs[] | .name as $j | .steps[]? | select(.status == "completed" and .conclusion != "skipped")
              | "\(if .conclusion == "success" then "✓" else "✗" end) \($j) › \(.name)"' <<<"$jobs")
            [[ "$(jq -r .status <<<"$run")" == completed ]] && break
            sleep 20
          done
          conclusion="$(jq -r .conclusion <<<"$run")"
          {
            echo "### Central release: $conclusion"
            echo "[$(jq -r .display_title <<<"$run")]($RUN_URL)"
            echo
            jq -r '.jobs[] | "- \(.name): \(.conclusion)"' <<<"$jobs"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Central release finished: $conclusion — $RUN_URL"
          [[ "$conclusion" == success ]]
