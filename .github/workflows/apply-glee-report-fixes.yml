name: Apply Glee report fixes

on:
  push:
    branches:
      - fix/glee-audit-findings

permissions:
  contents: write

jobs:
  patch-and-compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply Glee fixes
        run: python3 .ci/apply-glee-report-fixes.py

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit validated fixes and remove patch harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f .ci/apply-glee-report-fixes.py .github/workflows/apply-glee-report-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix confirmed Jules Glee audit findings'
          git push origin HEAD:${GITHUB_REF_NAME}
