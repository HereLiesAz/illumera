name: Fix source fallback recursion

on:
  push:
    branches:
      - feature/queue-lineup
    paths:
      - .github/workflows/fix-source-fallback-recursion.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/queue-lineup
          fetch-depth: 0
      - name: Fix recursive fallback lambda
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/hereliesaz/illumera/MainActivity.kt')
          s = p.read_text()
          old = '                            val tryNextRankedSource: suspend () -> Unit = nextSource@{\n'
          new = '                            lateinit var tryNextRankedSource: suspend () -> Unit\n                            tryNextRankedSource = nextSource@{\n'
          if old not in s:
              raise SystemExit('fallback lambda anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/hereliesaz/illumera/MainActivity.kt
          git commit -m "Fix recursive source fallback callback"
          git push origin HEAD:feature/queue-lineup
