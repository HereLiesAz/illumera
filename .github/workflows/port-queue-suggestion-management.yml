name: Port queue suggestion management

on:
  push:
    branches:
      - feature/queue-suggestion-management
    paths:
      - .github/workflows/port-queue-suggestion-management.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Patch queue behavior and UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manager = Path('app/src/main/java/com/hereliesaz/illumera/data/queue/QueueManager.kt')
          text = manager.read_text()

          text = text.replace(
          '''    val includeWholeShows: Boolean = false,\n    val suggestionSources: Set<QueueSuggestionSource> = setOf(\n''',
          '''    val includeWholeShows: Boolean = false,\n    val onlyUnseenSuggestions: Boolean = false,\n    val suggestionSources: Set<QueueSuggestionSource> = setOf(\n''', 1)

          text = text.replace(
          '''    @Synchronized\n    fun setIncludeWholeShows(enabled: Boolean) = updatePreferences { copy(includeWholeShows = enabled) }\n\n    @Synchronized\n    fun setSuggestionSource(source: QueueSuggestionSource, enabled: Boolean) {\n''',
          '''    @Synchronized\n    fun setIncludeWholeShows(enabled: Boolean) = updatePreferences { copy(includeWholeShows = enabled) }\n\n    @Synchronized\n    fun setOnlyUnseenSuggestions(enabled: Boolean) = updatePreferences { copy(onlyUnseenSuggestions = enabled) }\n\n    @Synchronized\n    fun setSuggestionSource(source: QueueSuggestionSource, enabled: Boolean) {\n''', 1)

          text = text.replace(
          '''    @Synchronized\n    fun rateSuggestion(key: String, rating: Int) {\n''',
          '''    @Synchronized\n    fun moveSuggestion(key: String, targetIndex: Int) {\n        val suggestions = _state.value.suggestions.toMutableList()\n        val from = suggestions.indexOfFirst { it.stableKey == key }\n        if (from < 0 || suggestions.isEmpty()) return\n        val to = targetIndex.coerceIn(0, suggestions.lastIndex)\n        if (from == to) return\n        val item = suggestions.removeAt(from)\n        suggestions.add(to, item)\n        commit(_state.value.copy(suggestions = suggestions))\n    }\n\n    @Synchronized\n    fun removeSuggestion(key: String) {\n        val current = _state.value\n        if (current.suggestions.none { it.stableKey == key }) return\n        val dismissed = dismissedSuggestionKeys().toMutableSet().apply { add(key) }\n        prefs.edit().putStringSet(KEY_DISMISSED_SUGGESTIONS, dismissed).apply()\n        commit(current.copy(suggestions = current.suggestions.filterNot { it.stableKey == key }))\n    }\n\n    @Synchronized\n    fun rateSuggestion(key: String, rating: Int) {\n''', 1)

          text = text.replace(
          '''    suspend fun ensureSuggestions() {\n        if (_state.value.suggestions.size < SUGGESTION_COUNT) refreshSuggestions()\n    }\n''',
          '''    suspend fun ensureSuggestions() {\n        if (_state.value.suggestions.size < SUGGESTION_COUNT) {\n            refreshSuggestions(preserveExisting = true)\n        }\n    }\n''', 1)

          start = text.index('    suspend fun refreshSuggestions() {')
          end = text.index('    private fun updatePreferences', start)
          replacement = '''    suspend fun refreshSuggestions(\n        resetDismissed: Boolean = false,\n        preserveExisting: Boolean = false\n    ) {\n        val current = _state.value\n        if (!current.preferences.enabled) return\n        if (resetDismissed) {\n            prefs.edit().remove(KEY_DISMISSED_SUGGESTIONS).apply()\n        }\n        val dismissedKeys = if (resetDismissed) emptySet() else dismissedSuggestionKeys()\n        _state.value = current.copy(isRefreshingSuggestions = true)\n        try {\n            val watched = addonDao.getAllWatchHistoryOnce()\n            val seenIds = watched.map { normalizeId(it.id) }.toSet()\n            val excludedIds = buildSet {\n                if (current.preferences.onlyUnseenSuggestions) {\n                    addAll(seenIds)\n                } else {\n                    addAll(watched.filter { it.watched }.map { normalizeId(it.id) })\n                }\n                addAll(current.manualItems.map { normalizeId(it.seriesId ?: it.id) })\n            }\n            val candidates = mutableListOf<QueueItem>()\n\n            if (QueueSuggestionSource.TRAKT in current.preferences.suggestionSources) {\n                if (current.preferences.includeMovies) {\n                    runCatching { traktApi.getMovieRecommendations(50) }.getOrNull()\n                        ?.takeIf { it.isSuccessful }?.body().orEmpty()\n                        .forEach { movie ->\n                            val id = movie.ids.imdb ?: movie.ids.tmdb?.let { "tmdb:$it" } ?: return@forEach\n                            if (normalizeId(id) !in excludedIds) {\n                                candidates += QueueItem(id, "movie", movie.title ?: "Movie", origin = QueueOrigin.SUGGESTED)\n                            }\n                        }\n                }\n                if (current.preferences.includeEpisodes || current.preferences.includeWholeShows) {\n                    runCatching { traktApi.getShowRecommendations(50) }.getOrNull()\n                        ?.takeIf { it.isSuccessful }?.body().orEmpty()\n                        .forEach { show ->\n                            val id = show.ids.imdb ?: show.ids.tmdb?.let { "tmdb:$it" } ?: return@forEach\n                            if (normalizeId(id) !in excludedIds) {\n                                candidates += QueueItem(\n                                    id = id,\n                                    type = "series",\n                                    title = show.title ?: "Series",\n                                    wholeShow = current.preferences.includeWholeShows,\n                                    origin = QueueOrigin.SUGGESTED\n                                )\n                            }\n                        }\n                }\n            }\n\n            if (QueueSuggestionSource.PLAY_HISTORY in current.preferences.suggestionSources &&\n                !current.preferences.onlyUnseenSuggestions\n            ) {\n                watched.asSequence()\n                    .filter { !it.watched }\n                    .filter {\n                        (it.type == "movie" && current.preferences.includeMovies) ||\n                            (it.type == "series" && current.preferences.includeEpisodes)\n                    }\n                    .sortedByDescending { it.lastWatched }\n                    .forEach { history ->\n                        candidates += QueueItem(\n                            id = history.id,\n                            type = history.type,\n                            title = history.title,\n                            poster = history.poster,\n                            origin = QueueOrigin.SUGGESTED\n                        )\n                    }\n            }\n\n            val ranked = candidates\n                .distinctBy { it.stableKey }\n                .filter { it.stableKey !in dismissedKeys }\n                .filter { prefs.getInt("rating_${it.stableKey}", 0) >= 0 }\n                .sortedWith(\n                    compareByDescending<QueueItem> { prefs.getInt("rating_${it.stableKey}", 0) }\n                        .thenBy { it.title }\n                )\n                .take(SUGGESTION_COUNT * 4)\n                .map { it.copy(rating = prefs.getInt("rating_${it.stableKey}", 0)) }\n\n            val existing = if (preserveExisting) {\n                current.suggestions\n                    .filter { it.stableKey !in dismissedKeys }\n                    .filter { prefs.getInt("rating_${it.stableKey}", 0) >= 0 }\n            } else {\n                emptyList()\n            }\n            val existingKeys = existing.mapTo(mutableSetOf()) { it.stableKey }\n            val nextSuggestions = (existing + ranked.filter { existingKeys.add(it.stableKey) })\n                .distinctBy { it.stableKey }\n                .take(SUGGESTION_COUNT)\n\n            commit(_state.value.copy(suggestions = nextSuggestions, isRefreshingSuggestions = false))\n            resolveMissingArtwork()\n        } catch (_: Exception) {\n            _state.value = _state.value.copy(isRefreshingSuggestions = false)\n        }\n    }\n\n    private fun dismissedSuggestionKeys(): Set<String> =\n        prefs.getStringSet(KEY_DISMISSED_SUGGESTIONS, emptySet())?.toSet().orEmpty()\n\n'''
          text = text[:start] + replacement + text[end:]

          text = text.replace(
          '''        private const val KEY_SUGGESTIONS = "suggestions"\n        private const val SUGGESTION_COUNT = 10\n''',
          '''        private const val KEY_SUGGESTIONS = "suggestions"\n        private const val KEY_DISMISSED_SUGGESTIONS = "dismissed_suggestions"\n        const val SUGGESTION_COUNT = 10\n''', 1)

          manager.write_text(text)

          screen = Path('app/src/main/java/com/hereliesaz/illumera/ui/queue/QueueScreen.kt')
          text = screen.read_text()

          text = text.replace(
          '''import androidx.compose.material3.Checkbox\nimport androidx.compose.material3.Icon\n''',
          '''import androidx.compose.material3.Checkbox\nimport androidx.compose.material3.DropdownMenu\nimport androidx.compose.material3.DropdownMenuItem\nimport androidx.compose.material3.Icon\n''', 1)
          text = text.replace(
          '''import androidx.compose.runtime.getValue\nimport androidx.compose.runtime.remember\n''',
          '''import androidx.compose.runtime.getValue\nimport androidx.compose.runtime.mutableStateOf\nimport androidx.compose.runtime.remember\nimport androidx.compose.runtime.setValue\n''', 1)

          text = text.replace(
          '''    LaunchedEffect(state.preferences.enabled) {\n        if (state.preferences.enabled && state.suggestions.size < 10) {\n            queueManager.refreshSuggestions()\n        }\n    }\n''',
          '''    LaunchedEffect(state.preferences.enabled, state.suggestions.size) {\n        if (state.preferences.enabled && state.suggestions.size < QueueManager.SUGGESTION_COUNT) {\n            queueManager.ensureSuggestions()\n        }\n    }\n''', 1)

          source_marker = '''            QueueOption(\n                label = "Trakt",\n                checked = QueueSuggestionSource.TRAKT in state.preferences.suggestionSources,\n                onCheckedChange = { enabled ->\n                    queueManager.setSuggestionSource(QueueSuggestionSource.TRAKT, enabled)\n                }\n            )\n\n            Button(\n'''
          source_replacement = '''            QueueOption(\n                label = "Trakt",\n                checked = QueueSuggestionSource.TRAKT in state.preferences.suggestionSources,\n                onCheckedChange = { enabled ->\n                    queueManager.setSuggestionSource(QueueSuggestionSource.TRAKT, enabled)\n                }\n            )\n            QueueOption(\n                label = "Only suggest things I haven't seen",\n                checked = state.preferences.onlyUnseenSuggestions,\n                onCheckedChange = { enabled ->\n                    queueManager.setOnlyUnseenSuggestions(enabled)\n                    scope.launch { queueManager.refreshSuggestions() }\n                }\n            )\n\n            Button(\n'''
          if source_marker not in text:
              raise SystemExit('suggestion source marker not found')
          text = text.replace(source_marker, source_replacement, 1)

          text = text.replace(
          '''                onClick = { scope.launch { queueManager.refreshSuggestions() } },\n''',
          '''                onClick = { scope.launch { queueManager.refreshSuggestions(resetDismissed = true) } },\n''', 1)

          text = text.replace(
          '''                actions = { item, _ ->\n''',
          '''                onMoveSuggestion = { item, targetIndex ->\n                    queueManager.moveSuggestion(item.stableKey, targetIndex)\n                },\n                onRemoveSuggestion = { item ->\n                    queueManager.removeSuggestion(item.stableKey)\n                },\n                actions = { item, _ ->\n''', 1)

          sig = '''private fun QueueCardRow(\n    title: String,\n    items: List<QueueItem>,\n    startPadding: Dp,\n    onOpenItem: (QueueItem) -> Unit,\n    actions: @Composable (QueueItem, Int) -> Unit\n) {\n'''
          newsig = '''private fun QueueCardRow(\n    title: String,\n    items: List<QueueItem>,\n    startPadding: Dp,\n    onOpenItem: (QueueItem) -> Unit,\n    onMoveSuggestion: ((QueueItem, Int) -> Unit)? = null,\n    onRemoveSuggestion: ((QueueItem) -> Unit)? = null,\n    actions: @Composable (QueueItem, Int) -> Unit\n) {\n'''
          if sig not in text:
              raise SystemExit('QueueCardRow signature marker not found')
          text = text.replace(sig, newsig, 1)

          card_old = '''                Column(modifier = Modifier.width(140.dp)) {\n                    LumeraCard(\n                        title = item.title,\n                        posterUrl = item.poster,\n                        onClick = { onOpenItem(item) }\n                    )\n\n                    Spacer(Modifier.height(6.dp))\n'''
          card_new = '''                Column(modifier = Modifier.width(140.dp)) {\n                    var menuExpanded by remember(item.stableKey) { mutableStateOf(false) }\n                    androidx.compose.foundation.layout.Box {\n                        LumeraCard(\n                            title = item.title,\n                            posterUrl = item.poster,\n                            onClick = { onOpenItem(item) },\n                            onLongClick = if (onMoveSuggestion != null && onRemoveSuggestion != null) {\n                                { menuExpanded = true }\n                            } else null\n                        )\n\n                        DropdownMenu(\n                            expanded = menuExpanded,\n                            onDismissRequest = { menuExpanded = false }\n                        ) {\n                            if (onMoveSuggestion != null) {\n                                DropdownMenuItem(\n                                    text = { Text("Move to position", fontWeight = FontWeight.SemiBold) },\n                                    onClick = {},\n                                    enabled = false\n                                )\n                                items.indices.forEach { targetIndex ->\n                                    DropdownMenuItem(\n                                        text = { Text("${targetIndex + 1}") },\n                                        onClick = {\n                                            menuExpanded = false\n                                            onMoveSuggestion(item, targetIndex)\n                                        },\n                                        enabled = targetIndex != index\n                                    )\n                                }\n                            }\n                            if (onRemoveSuggestion != null) {\n                                DropdownMenuItem(\n                                    text = { Text("Remove from queue") },\n                                    onClick = {\n                                        menuExpanded = false\n                                        onRemoveSuggestion(item)\n                                    },\n                                    leadingIcon = { Icon(Icons.Default.Delete, contentDescription = null) }\n                                )\n                            }\n                        }\n                    }\n\n                    Spacer(Modifier.height(6.dp))\n'''
          if card_old not in text:
              raise SystemExit('queue card marker not found')
          text = text.replace(card_old, card_new, 1)

          screen.write_text(text)
          PY

      - name: Commit queue suggestion management
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/hereliesaz/illumera/data/queue/QueueManager.kt \
                  app/src/main/java/com/hereliesaz/illumera/ui/queue/QueueScreen.kt
          git diff --cached --check
          git commit -m "Improve queue suggestion management"
          git push origin HEAD:feature/queue-suggestion-management
