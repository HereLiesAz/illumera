name: Code Scanning Alert Inventory

on:
  push:
    branches:
      - chore/code-scanning-inventory

permissions:
  contents: read
  security-events: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: List open code scanning alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/code-scanning/alerts?state=open&per_page=100"
          req = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "illumera-code-scanning-inventory",
              },
          )
          with urllib.request.urlopen(req) as response:
              alerts = json.load(response)

          print(f"OPEN_ALERT_COUNT\t{len(alerts)}")
          print("NUMBER\tSEVERITY\tRULE_ID\tRULE_NAME\tPATH\tLINE")
          for alert in alerts:
              rule = alert.get("rule") or {}
              instance = alert.get("most_recent_instance") or {}
              loc = instance.get("location") or {}
              region = loc.get("region") or {}
              severity = rule.get("security_severity_level") or rule.get("severity") or "unknown"
              values = [
                  alert.get("number", ""),
                  severity,
                  rule.get("id", ""),
                  rule.get("name", ""),
                  loc.get("path", ""),
                  region.get("start_line", ""),
              ]
              print("\t".join(str(v).replace("\t", " ").replace("\n", " ") for v in values))
          PY
