name: Apply source intelligence

on:
  push:
    branches:
      - feature/queue-lineup
    paths:
      - .github/workflows/apply-source-intelligence.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout illumera
        uses: actions/checkout@v4
        with:
          ref: feature/queue-lineup
          fetch-depth: 0
      - name: Apply source intelligence patch
        run: python3 tools/apply_source_intelligence.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/hereliesaz/illumera
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Integrate intelligent source fallback"
          git push origin HEAD:feature/queue-lineup
