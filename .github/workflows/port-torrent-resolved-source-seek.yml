name: Port torrent resolved source seek fix

on:
  push:
    branches:
      - fix/torrent-resolved-source-seek
    paths:
      - .github/workflows/port-torrent-resolved-source-seek.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Port resolved torrent source seek fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/hereliesaz/illumera/ui/player/base/ExoPlayerBackend.kt')
          text = path.read_text()

          old_initial = '''            } else {\n                // mediaUrl doesn't match any source (e.g. resolved torrent localhost URL)\n                // Play the mediaUrl directly, mark first source as current\n                currentSourceId = normalizedSources.firstOrNull()?.id\n                prepareSource(\n                    source = defaultSource,\n                    startPositionMs = request.startPositionMs,\n                    autoPlay = request.autoPlay\n                )\n            }\n'''
          new_initial = '''            } else {\n                // A resolved torrent URL is a playable localhost URL while the source\n                // option may still contain its original magnet URI. Keep the logical\n                // source ID, but replace that option's URL with the playable URL so\n                // later seeks, retries and source-state operations do not fall back to\n                // the stale magnet URI.\n                val firstSource = normalizedSources.firstOrNull()\n                if (firstSource != null) {\n                    currentSourceId = firstSource.id\n                    val resolvedSource = firstSource.copy(url = normalizedRequest.mediaUrl)\n                    _sourceOptions.value = normalizedSources.map { source ->\n                        if (source.id == firstSource.id) resolvedSource else source\n                    }\n                    prepareSource(\n                        source = resolvedSource,\n                        startPositionMs = request.startPositionMs,\n                        autoPlay = request.autoPlay\n                    )\n                } else {\n                    currentSourceId = defaultSource.id\n                    prepareSource(\n                        source = defaultSource,\n                        startPositionMs = request.startPositionMs,\n                        autoPlay = request.autoPlay\n                    )\n                }\n            }\n'''
          if new_initial not in text:
              if old_initial not in text:
                  raise SystemExit('resolved initial source marker not found')
              text = text.replace(old_initial, new_initial, 1)

          old_resume = '''        if (wasPaused && player.playbackState == Player.STATE_READY) {\n'''
          new_resume = '''        if (wasPaused && player.playbackState == Player.STATE_READY && !isTorrentStream) {\n'''
          if new_resume not in text:
              if old_resume not in text:
                  raise SystemExit('resume codec-flush marker not found')
              text = text.replace(old_resume, new_resume, 1)

          old_switch = '''                handler(source.url, source.fileIdx, source.fileName) { localUrl ->\n                    if (released) return@handler\n                    val resolvedSource = source.copy(url = localUrl)\n                    switchToSource(sourceId, resolvedSource)\n                }\n'''
          new_switch = '''                handler(source.url, source.fileIdx, source.fileName) { localUrl ->\n                    if (released) return@handler\n                    val resolvedSource = source.copy(url = localUrl)\n                    _sourceOptions.value = _sourceOptions.value.map { option ->\n                        if (option.id == sourceId) resolvedSource else option\n                    }\n                    switchToSource(sourceId, resolvedSource)\n                }\n'''
          if new_switch not in text:
              if old_switch not in text:
                  raise SystemExit('resolved source-switch marker not found')
              text = text.replace(old_switch, new_switch, 1)

          path.write_text(text)
          PY

      - name: Commit resolved source seek fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/hereliesaz/illumera/ui/player/base/ExoPlayerBackend.kt
          git diff --cached --check
          git commit -m "Fix seeking on resolved torrent sources"
          git push origin HEAD:fix/torrent-resolved-source-seek
