          ''',
          '''                _state.value = _state.value.copy(
                          resumePlaybackId = resumePlaybackId,
                          isResumeStateReady = true,
                          isMovieWatched = isMovieWatched,
                          episodeProgressMap = episodeProgressMap
                      )
