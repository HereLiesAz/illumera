name: Fix legacy PR review followups

on:
  push:
    branches:
      - fix/legacy-pr-review-followups
    paths:
      - .github/workflows/fix-legacy-review-followups.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply legacy review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing pattern in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count))

          # PR #65: update individual navigation columns atomically.
          rep('app/src/main/java/com/hereliesaz/illumera/data/local/AddonDao.kt',
          '''    @Update
              suspend fun updateProfile(profile: ProfileEntity)
          ''',
          '''    @Update
              suspend fun updateProfile(profile: ProfileEntity)

              @Query("UPDATE profiles SET menuMoviesEnabled = :enabled WHERE id = :profileId")
              suspend fun updateMenuMoviesEnabled(profileId: Int, enabled: Boolean)

              @Query("UPDATE profiles SET menuSeriesEnabled = :enabled WHERE id = :profileId")
              suspend fun updateMenuSeriesEnabled(profileId: Int, enabled: Boolean)

              @Query("UPDATE profiles SET menuWatchlistEnabled = :enabled WHERE id = :profileId")
              suspend fun updateMenuWatchlistEnabled(profileId: Int, enabled: Boolean)
          ''')

          rep('app/src/main/java/com/hereliesaz/illumera/ui/settings/SettingsViewModel.kt',
          '''    fun updateMenuMoviesEnabled(profileId: Int, enabled: Boolean) {
                  viewModelScope.launch(Dispatchers.IO + NonCancellable) {
                      dao.getProfileById(profileId)?.let { dao.insertProfile(it.copy(menuMoviesEnabled = enabled)) }
                  }
              }

              fun updateMenuSeriesEnabled(profileId: Int, enabled: Boolean) {
                  viewModelScope.launch(Dispatchers.IO + NonCancellable) {
                      dao.getProfileById(profileId)?.let { dao.insertProfile(it.copy(menuSeriesEnabled = enabled)) }
                  }
              }

              fun updateMenuWatchlistEnabled(profileId: Int, enabled: Boolean) {
                  viewModelScope.launch(Dispatchers.IO + NonCancellable) {
                      dao.getProfileById(profileId)?.let { dao.insertProfile(it.copy(menuWatchlistEnabled = enabled)) }
                  }
              }
          ''',
          '''    fun updateMenuMoviesEnabled(profileId: Int, enabled: Boolean) {
                  viewModelScope.launch(Dispatchers.IO + NonCancellable) {
                      dao.updateMenuMoviesEnabled(profileId, enabled)
                  }
              }

              fun updateMenuSeriesEnabled(profileId: Int, enabled: Boolean) {
                  viewModelScope.launch(Dispatchers.IO + NonCancellable) {
                      dao.updateMenuSeriesEnabled(profileId, enabled)
                  }
              }

              fun updateMenuWatchlistEnabled(profileId: Int, enabled: Boolean) {
                  viewModelScope.launch(Dispatchers.IO + NonCancellable) {
                      dao.updateMenuWatchlistEnabled(profileId, enabled)
                  }
              }
          ''')

          rep('app/src/main/java/com/hereliesaz/illumera/data/profile/ProfileConfigurationManager.kt',
          '''                navPosition = sourceProfile.navPosition,
                          homeTabLayout = sourceProfile.homeTabLayout,
          ''',
          '''                navPosition = sourceProfile.navPosition,
                          menuMoviesEnabled = sourceProfile.menuMoviesEnabled,
                          menuSeriesEnabled = sourceProfile.menuSeriesEnabled,
                          menuWatchlistEnabled = sourceProfile.menuWatchlistEnabled,
                          homeTabLayout = sourceProfile.homeTabLayout,
          ''')

          # PR #35: never replace the remote addon collection with a partial manifest set.
          rep('app/src/main/java/com/hereliesaz/illumera/data/auth/StremioAuthManager.kt',
          '''            val descriptors = transportUrls.mapNotNull { url ->
                          runCatching {
                              StremioAddonDescriptor(
                                  manifest = stremioAuthService.fetchRawManifest(url),
                                  transportUrl = if (url.endsWith("manifest.json")) url else "${url.trimEnd('/')}/manifest.json",
                                  flags = StremioAddonFlags()
                              )
                          }.getOrNull()
                      }
          ''',
          '''            val descriptors = transportUrls.map { url ->
