          rep('app/src/main/java/com/hereliesaz/illumera/ui/details/DetailsViewModel.kt',
          '''        viewModelScope.launch {
                  val resumePlaybackId = if (meta.type == "series") {
          ''',
          '''        _state.value = _state.value.copy(isResumeStateReady = false)
                  viewModelScope.launch {
                  val resumePlaybackId = if (meta.type == "series") {
          ''')
          rep('app/src/main/java/com/hereliesaz/illumera/ui/details/DetailsViewModel.kt',
