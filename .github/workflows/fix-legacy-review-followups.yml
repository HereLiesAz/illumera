                              transportUrl = if (url.endsWith("manifest.json")) url else "${url.trimEnd('/')}/manifest.json",
                              flags = StremioAddonFlags()
                          )
                      }
          ''')

          # PR #36: disconnect must clear the active profile-scoped credential too.
          rep('app/src/main/java/com/hereliesaz/illumera/ui/settings/IntegrationsViewModel.kt',
          '''    fun disconnect() {
                  stremioAuthManager.disconnect()
                  viewModelScope.launch {
                      _events.send(IntegrationsEvent.Disconnected)
                  }
              }
          ''',
          '''    fun disconnect() {
                  val profileId = profileConfigurationManager.getLastActiveProfileId() ?: 1
                  stremioAuthManager.clearCredentialsForProfile(profileId)
                  stremioAuthManager.disconnect()
                  viewModelScope.launch {
                      _events.send(IntegrationsEvent.Disconnected)
                  }
              }
          ''')

          # PR #55: don't let Play resolve to episode 1 before history/next-up lookup finishes.
          rep('app/src/main/java/com/hereliesaz/illumera/ui/details/DetailsViewModel.kt',
