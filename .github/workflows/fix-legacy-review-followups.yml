                          isMovieWatched = isMovieWatched,
                          autoPlayStream = null,
          ''')

          rep('app/src/main/java/com/hereliesaz/illumera/ui/details/DetailsScreen.kt',
          '''                    val playLabel = if (resumePlaybackId != null) {
          ''',
          '''                    val playLabel = if (!state.isResumeStateReady) {
                              "Loading…"
                          } else if (resumePlaybackId != null) {
          ''')
          rep('app/src/main/java/com/hereliesaz/illumera/ui/details/DetailsScreen.kt',
          '''                            onClick = {
                                  val ep = resumeEpisode ?: firstEpisode ?: return@ExpandableIconButton
          ''',
          '''                            onClick = {
                                  if (!state.isResumeStateReady) return@ExpandableIconButton
                                  val ep = resumeEpisode ?: firstEpisode ?: return@ExpandableIconButton
          ''')
          rep('app/src/main/java/com/hereliesaz/illumera/ui/details/DetailsScreen.kt',
          '''                        label = if (resumePlaybackId != null) "Resume" else "Play Movie",
                          icon = Icons.Default.PlayArrow,
                          modifier = Modifier.focusRequester(firstButtonFocusRequester),
                          onClick = {
                              pendingPlaybackId = streamId
          ''',
          '''                        label = if (!state.isResumeStateReady) "Loading…" else if (resumePlaybackId != null) "Resume" else "Play Movie",
                          icon = Icons.Default.PlayArrow,
                          modifier = Modifier.focusRequester(firstButtonFocusRequester),
                          onClick = {
                              if (!state.isResumeStateReady) return@ExpandableIconButton
                              pendingPlaybackId = streamId
          ''')

          # PR #58: canonicalize series artwork and keep only one artwork-resolution trigger.
          rep('app/src/main/java/com/hereliesaz/illumera/data/queue/QueueManager.kt',
          '''    fun toMetaItem(): MetaItem = MetaItem(
                  id = seriesId ?: id,
                  type = if (type == "episode") "series" else type,
                  name = title,
                  poster = poster
              )
          ''',
          '''    fun toMetaItem(): MetaItem {
                  val canonicalId = seriesId ?: if (type == "episode" || type == "series") {
                      val parts = id.split(':')
                      if (parts.size >= 3 && parts.takeLast(2).all { it.toIntOrNull() != null }) {
                          parts.dropLast(2).joinToString(":")
                      } else id
                  } else id
                  return MetaItem(
                      id = canonicalId,
                      type = if (type == "episode" || type == "series") "series" else type,
                      name = title,
                      poster = poster
                  )
              }
          ''')
          rep('app/src/main/java/com/hereliesaz/illumera/data/queue/QueueManager.kt',
          '''            commit(latestState.copy(suggestions = nextSuggestions, isRefreshingSuggestions = false))
                      resolveMissingArtwork()
          ''',
          '''            commit(latestState.copy(suggestions = nextSuggestions, isRefreshingSuggestions = false))
          ''')

          # PR #58: remember/restore focus for queue cards embedded in Watchlist.
          rep('app/src/main/java/com/hereliesaz/illumera/ui/watchlist/WatchlistViewModel.kt',
          '''    var lastFocusedKey: String? = null
          ''',
          '''    var lastFocusedKey: String? = null
              var lastQueueFocusedKey: String? = null
          ''')
          rep('app/src/main/java/com/hereliesaz/illumera/ui/watchlist/WatchlistScreen.kt',
          '''                QueueSection(
                          entryRequester = entryRequester,
                          startPadding = startPadding,
                          requestEntryFocus = !hasWatchlistMedia,
                          onOpenItem = { queueItem: QueueItem ->
          ''',
          '''                QueueSection(
                          entryRequester = entryRequester,
                          startPadding = startPadding,
                          requestEntryFocus = !hasWatchlistMedia && viewModel.lastQueueFocusedKey == null,
                          focusedQueueKey = viewModel.lastQueueFocusedKey,
                          onQueueFocused = { key -> viewModel.lastQueueFocusedKey = key },
                          onOpenItem = { queueItem: QueueItem ->
          ''')
          rep('app/src/main/java/com/hereliesaz/illumera/ui/queue/QueueScreen.kt',
          '''    queueManager: QueueManager = hiltViewModel<QueueViewModel>().queueManager,
              requestEntryFocus: Boolean = false
          ) {
          ''',
          '''    queueManager: QueueManager = hiltViewModel<QueueViewModel>().queueManager,
              requestEntryFocus: Boolean = false,
              focusedQueueKey: String? = null,
              onQueueFocused: (String) -> Unit = {}
          ) {
          ''')
          rep('app/src/main/java/com/hereliesaz/illumera/ui/queue/QueueScreen.kt',
          '''                onOpenItem = onOpenItem,
                          actions = { item, index ->
          ''',
          '''                onOpenItem = onOpenItem,
                          focusedKey = focusedQueueKey,
                          onFocused = onQueueFocused,
                          actions = { item, index ->
          ''', 1)
          rep('app/src/main/java/com/hereliesaz/illumera/ui/queue/QueueScreen.kt',
          '''                onOpenItem = onOpenItem,
                          onMoveSuggestion = { item, targetIndex ->
          ''',
          '''                onOpenItem = onOpenItem,
                          focusedKey = focusedQueueKey,
                          onFocused = onQueueFocused,
                          onMoveSuggestion = { item, targetIndex ->
          ''')
          rep('app/src/main/java/com/hereliesaz/illumera/ui/queue/QueueScreen.kt',
          '''    onOpenItem: (QueueItem) -> Unit,
              onMoveSuggestion: ((QueueItem, Int) -> Unit)? = null,
          ''',
          '''    onOpenItem: (QueueItem) -> Unit,
              focusedKey: String? = null,
              onFocused: (String) -> Unit = {},
              onMoveSuggestion: ((QueueItem, Int) -> Unit)? = null,
          ''')
          rep('app/src/main/java/com/hereliesaz/illumera/ui/queue/QueueScreen.kt',
          '''            itemsIndexed(items, key = { _, item -> item.stableKey }) { index, item ->
                      Column(modifier = Modifier.width(140.dp)) {
          ''',
          '''            itemsIndexed(items, key = { _, item -> item.stableKey }) { index, item ->
                      val cardFocusRequester = remember(item.stableKey) { FocusRequester() }
                      LaunchedEffect(focusedKey, item.stableKey) {
                          if (focusedKey == item.stableKey) {
                              kotlinx.coroutines.delay(50)
                              runCatching { cardFocusRequester.requestFocus() }
                          }
                      }
                      Column(modifier = Modifier.width(140.dp)) {
          ''')
          rep('app/src/main/java/com/hereliesaz/illumera/ui/queue/QueueScreen.kt',
          '''                        LumeraCard(
                              title = item.title,
                              posterUrl = item.poster,
                              onClick = { onOpenItem(item) },
          ''',
          '''                        LumeraCard(
                              title = item.title,
                              posterUrl = item.poster,
                              onClick = { onOpenItem(item) },
                              modifier = Modifier.focusRequester(cardFocusRequester),
                              onFocused = { onFocused(item.stableKey) },
          ''')

          # PR #36: make Play submission notes describe actual cleartext paths.
          rep('docs/PLAY_STORE.md',
          '''### Is all of the user data collected by your app encrypted in transit?
          **Yes** — every network call in the app goes over HTTPS (Trakt, Stremio,
          TMDB, debrid provider APIs, the ACRA crash-report endpoint). User-added
          addon URLs are the one exception outside the app's control: an addon author
          could point their manifest at a plain-`http://` endpoint, in which case that
          specific addon's traffic wouldn't be encrypted. **[confirm]** whether Play
          wants this caveat noted or a blanket "yes" — if the form is strictly
          per-app-code rather than per-user-configuration, "yes" is defensible since
          the app itself never initiates unencrypted requests to any of its own
          integrations.
          ''',
          '''### Is all of the user data collected by your app encrypted in transit?
          **[confirm against the current Play form before submitting.]** Internet-facing
          account/provider integrations (Trakt, Stremio, TMDB, debrid APIs and crash
          reporting) use HTTPS, but the app intentionally also uses cleartext HTTP for
          its loopback TorrServer (`http://127.0.0.1:8090`) and local-LAN pairing flows.
          User-configured addon endpoints may also be plain `http://`. Do **not** claim
          that every network call is HTTPS; if Play's question requires every supported
          transport path to be encrypted, answer **No**.
          ''')
          rep('docs/PLAY_STORE.md',
          '''- "Data is encrypted in transit" → **Yes** (see above).
          ''',
          '''- "Data is encrypted in transit" → **[confirm]** using the current Play
            definition; do not select Yes if the form treats the supported cleartext
            localhost/LAN/user-configured HTTP paths as disqualifying (see above).
          ''')
          rep('docs/PLAY_STORE.md',
          '''for each connected service (Stremio, Trakt, each debrid provider) that wipes
          the locally-stored credential immediately — no waiting period, no account
          needed to make the request. Note the scope: this deletes what *illumera*
          ''',
          '''for each connected service (Stremio, Trakt, each debrid provider) that wipes
          the locally-stored credential immediately for the active profile — no waiting
          period, no account needed to make the request. Note the scope: this deletes what *illumera*
          ''')
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/hereliesaz/illumera/data/local/AddonDao.kt \
                  app/src/main/java/com/hereliesaz/illumera/ui/settings/SettingsViewModel.kt \
                  app/src/main/java/com/hereliesaz/illumera/data/profile/ProfileConfigurationManager.kt \
                  app/src/main/java/com/hereliesaz/illumera/data/auth/StremioAuthManager.kt \
                  app/src/main/java/com/hereliesaz/illumera/ui/settings/IntegrationsViewModel.kt \
                  app/src/main/java/com/hereliesaz/illumera/ui/details/DetailsViewModel.kt \
                  app/src/main/java/com/hereliesaz/illumera/ui/details/DetailsScreen.kt \
                  app/src/main/java/com/hereliesaz/illumera/data/queue/QueueManager.kt \
                  app/src/main/java/com/hereliesaz/illumera/ui/queue/QueueScreen.kt \
                  app/src/main/java/com/hereliesaz/illumera/ui/watchlist/WatchlistScreen.kt \
                  app/src/main/java/com/hereliesaz/illumera/ui/watchlist/WatchlistViewModel.kt \
                  docs/PLAY_STORE.md
          git diff --cached --check
          git commit -m "Address legacy PR review findings"
          git push origin HEAD:fix/legacy-pr-review-followups
