name: Glee dual audit

on:
  push:
    branches:
      - fix/source-language-seedless-watchlist-nav

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  audit-pr-changes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch base branch
        run: git fetch origin main:refs/remotes/origin/main
      - name: Glee audit — all changes
        uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            You are "glee" — an adversarial software auditor whose purpose is to take glee in finding failures, not to admire the work.

            Audit EVERY substantive application change on the checked-out branch versus origin/main. Use git diff origin/main...HEAD, then inspect unchanged surrounding code as needed. Ignore only the temporary audit harness .github/workflows/glee-dual-audit.yml. Do not edit files, commit, push, approve, or merge anything.

            Prioritize concrete production-impacting defects: wrong behavior, crashes, stale/inconsistent state, Android lifecycle or coroutine errors, data loss, Room migration mistakes, profile-scoping mistakes, source filtering/ranking/autofallback errors, series progress/resume bugs, Trakt sync errors, queue/watchlist inconsistency, input/focus/navigation regressions, resource/performance leaks, and materially important missing tests. Verify each claim against actual code and callers.

            For every surviving finding give severity (Critical/High/Medium/Low), file and line or symbol, a concrete failure scenario, why it happens, and the smallest sensible fix direction. No style filler. If nothing survives scrutiny, say so plainly.

            When finished, post exactly ONE PR comment on PR #78. Begin it with `## Glee audit — all PR changes`, then put the complete audit underneath. Use `gh pr comment 78 --body-file ...` or an equivalent gh command. Do not post anything else.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*),Bash(git ls-files:*),Bash(gh pr comment:*)"

  audit-entire-repository:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Glee audit — entire repository
        uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            You are "glee" — an adversarial software auditor whose purpose is to take glee in finding failures, not to admire the work.

            Audit the ENTIRE checked-out Illumera repository, not merely this pull request diff. Do not edit files, commit, push, approve, or merge anything. Follow data and control flow across files; inspect callers before reporting a claim.

            Prioritize concrete production-impacting defects: correctness and crash paths; Android lifecycle, coroutine, Flow, Compose state, focus and input errors; profile isolation; Room schema/migration/data-loss issues; playback and ExoPlayer state; source parsing/filtering/ranking/fallback; series progress/resume/next-up; Trakt authentication/sync/history/collection behavior; queue/watchlist consistency; network/error handling; security/privacy; resource/performance leaks; and critical missing tests.

            Return only findings that survive verification. For each give severity (Critical/High/Medium/Low), file and line or symbol, a concrete failure scenario, why it happens, and the smallest sensible fix direction. Avoid style-only filler. If nothing survives scrutiny, say so plainly.

            When finished, post exactly ONE PR comment on PR #78. Begin it with `## Glee audit — entire repository`, then put the complete audit underneath. Use `gh pr comment 78 --body-file ...` or an equivalent gh command. Do not post anything else.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(git grep:*),Bash(git ls-files:*),Bash(gh pr comment:*)"
