name: Glee audit

on:
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to audit
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: glee-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  audit-pr:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' && github.event.pull_request.user.type == 'User' && !endsWith(github.actor, '[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Jules Glee audit
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}" || { echo 'JULES_API_KEY secret is not configured'; exit 1; }

          if [ "$EVENT_NAME" = pull_request ]; then
            PR_NUMBER="$EVENT_PR_NUMBER"
          else
            PR_NUMBER="$INPUT_PR_NUMBER"
          fi

          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName,baseRefName)
          HEAD_BRANCH=$(jq -r '.headRefName' <<<"$PR_JSON")
          BASE_BRANCH=$(jq -r '.baseRefName' <<<"$PR_JSON")

          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          SOURCE=''
          STARTING_BRANCH=''
          PAGE_TOKEN=''
          while :; do
            URL='https://jules.googleapis.com/v1alpha/sources?pageSize=100'
            [ -z "$PAGE_TOKEN" ] || URL="$URL&pageToken=$(jq -rn --arg v "$PAGE_TOKEN" '$v|@uri')"
            PAGE=$(curl -fsS -H "x-goog-api-key: $JULES_API_KEY" "$URL")
            SOURCE_JSON=$(jq -c --arg owner "$OWNER" --arg repo "$NAME" '[.sources[]? | select((.githubRepo.owner|ascii_downcase)==($owner|ascii_downcase) and (.githubRepo.repo|ascii_downcase)==($repo|ascii_downcase))][0] // empty' <<<"$PAGE")
            if [ -n "$SOURCE_JSON" ]; then
              SOURCE=$(jq -r '.name // empty' <<<"$SOURCE_JSON")
              STARTING_BRANCH=$(jq -r --arg base "$BASE_BRANCH" '[.githubRepo.branches[]?.displayName | select(. == $base)][0] // .githubRepo.defaultBranch.displayName // empty' <<<"$SOURCE_JSON")
              break
            fi
            PAGE_TOKEN=$(jq -r '.nextPageToken // empty' <<<"$PAGE")
            [ -n "$PAGE_TOKEN" ] || break
          done
          test -n "$SOURCE" || { echo "Jules source not found for $REPO"; exit 1; }
          test -n "$STARTING_BRANCH" || { echo 'Jules source has no usable branch'; exit 1; }

          git diff --no-ext-diff --unified=30 "origin/$BASE_BRANCH...origin/$HEAD_BRANCH" > /tmp/pr.diff
          test -s /tmp/pr.diff || { echo 'PR diff is empty'; exit 1; }

          {
            echo "Audit pull request #$PR_NUMBER from $HEAD_BRANCH into $BASE_BRANCH as Glee."
            echo 'Find concrete production-impacting defects only. Trace callers and surrounding code before reporting.'
            echo 'Return a concise report with severity, file/symbol, failure scenario, cause, and smallest sensible fix. If no finding survives scrutiny, say so plainly.'
            echo
            echo '--- BEGIN AUTHORITATIVE PR DIFF ---'
            cat /tmp/pr.diff
            echo '--- END AUTHORITATIVE PR DIFF ---'
          } > /tmp/prompt.txt

          jq -n \
            --rawfile prompt /tmp/prompt.txt \
            --arg title "Glee PR audit — #$PR_NUMBER — ${GITHUB_SHA:0:12}" \
            --arg source "$SOURCE" \
            --arg branch "$STARTING_BRANCH" \
            '{prompt:$prompt,title:$title,sourceContext:{source:$source,githubRepoContext:{startingBranch:$branch}},requirePlanApproval:false,automationMode:"AUTOMATION_MODE_UNSPECIFIED"}' \
            > /tmp/session.json

          RESPONSE=$(curl -fsS -X POST \
            -H "x-goog-api-key: $JULES_API_KEY" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/session.json \
            'https://jules.googleapis.com/v1alpha/sessions')
          SESSION_ID=$(jq -r '.name' <<<"$RESPONSE" | sed 's#^sessions/##')
          test -n "$SESSION_ID" || { echo "$RESPONSE"; exit 1; }

          STATE=''
          for _ in $(seq 1 120); do
            STATUS=$(curl -fsS -H "x-goog-api-key: $JULES_API_KEY" "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID")
            STATE=$(jq -r '.state' <<<"$STATUS")
            case "$STATE" in
              COMPLETED) break ;;
              FAILED|AWAITING_USER_FEEDBACK) echo "$STATUS"; exit 1 ;;
            esac
            sleep 15
          done
          test "$STATE" = COMPLETED || { echo "Jules audit timed out in state ${STATE:-unknown}"; exit 1; }

          ACTIVITIES=$(curl -fsS -H "x-goog-api-key: $JULES_API_KEY" "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID/activities?pageSize=100")
          REPORT=$(jq -r '[.activities[] | .agentMessaged.agentMessage? // empty] | map(select(length>0)) | last // empty' <<<"$ACTIVITIES")
          test -n "$REPORT" || { echo 'Jules completed without an audit report'; exit 1; }

          {
            echo "## Glee audit — PR #$PR_NUMBER"
            echo
            echo "$REPORT"
          } > /tmp/glee.md
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/glee.md
          cat /tmp/glee.md >> "$GITHUB_STEP_SUMMARY"
