name: Glee dual audit

on:
  push:
    branches:
      - fix/source-language-seedless-watchlist-nav

permissions:
  contents: read
  pull-requests: write

jobs:
  audit-pr-changes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Jules Glee audit — all PR changes
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}" || { echo 'JULES_API_KEY secret is not configured'; exit 1; }

          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          SOURCE=''
          PAGE_TOKEN=''
          while :; do
            URL='https://jules.googleapis.com/v1alpha/sources?pageSize=100'
            if [ -n "$PAGE_TOKEN" ]; then
              URL="$URL&pageToken=$(jq -rn --arg v "$PAGE_TOKEN" '$v|@uri')"
            fi
            PAGE=$(curl -fsS -H "x-goog-api-key: $JULES_API_KEY" "$URL")
            SOURCE=$(jq -r --arg owner "$OWNER" --arg repo "$NAME" '[.sources[]? | select((.githubRepo.owner|ascii_downcase)==($owner|ascii_downcase) and (.githubRepo.repo|ascii_downcase)==($repo|ascii_downcase)) | .name][0] // empty' <<<"$PAGE")
            [ -n "$SOURCE" ] && break
            PAGE_TOKEN=$(jq -r '.nextPageToken // empty' <<<"$PAGE")
            [ -z "$PAGE_TOKEN" ] && break
          done
          test -n "$SOURCE" || { echo "Jules source not found for $REPO after scanning all connected sources"; exit 1; }

          cat > /tmp/prompt.txt <<'PROMPT'
          You are Glee, an adversarial software auditor. Audit EVERY substantive application change on this branch versus main, plus all unchanged surrounding code needed to verify behavior. Do not modify files, do not create commits or pull requests, and do not propose cosmetic/style-only changes. Assume the implementation is confidently wrong somewhere and try to prove it.

          Prioritize concrete production-impacting defects: incorrect behavior, crashes, stale/inconsistent state, Android lifecycle/coroutine/Flow/Compose errors, data loss, Room migration mistakes, profile-scoping mistakes, source filtering/ranking/autofallback failures, series progress/resume/next-up bugs, Trakt sync/history/collection errors, queue/watchlist inconsistency, focus/input/navigation regressions, security/privacy defects, resource/performance leaks, and materially important missing tests. Trace callers and data flow before reporting anything.

          Return ONLY a concise audit report. For every finding provide severity (Critical/High/Medium/Low), file and line or symbol, a concrete failure scenario, why it happens, and the smallest sensible fix direction. If no finding survives scrutiny, say that plainly. This is an audit only: make no code changes.
          PROMPT

          PAYLOAD=$(jq -n \
            --arg prompt "$(cat /tmp/prompt.txt)" \
            --arg title 'Glee audit — all PR changes' \
            --arg source "$SOURCE" \
            --arg branch "$BRANCH" \
            '{prompt:$prompt,title:$title,sourceContext:{source:$source,githubRepoContext:{startingBranch:$branch}},requirePlanApproval:false}')

          SESSION_JSON=$(curl -fsS -X POST \
            -H "x-goog-api-key: $JULES_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            'https://jules.googleapis.com/v1alpha/sessions')
          SESSION_NAME=$(jq -r '.name' <<<"$SESSION_JSON")
          SESSION_ID=${SESSION_NAME#sessions/}
          echo "Jules session: $(jq -r '.url // empty' <<<"$SESSION_JSON")"

          for i in $(seq 1 120); do
            STATUS=$(curl -fsS -H "x-goog-api-key: $JULES_API_KEY" \
              "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID")
            STATE=$(jq -r '.state' <<<"$STATUS")
            case "$STATE" in
              COMPLETED) break ;;
              FAILED) echo "$STATUS"; exit 1 ;;
              AWAITING_USER_FEEDBACK) echo 'Jules requested user feedback unexpectedly'; echo "$STATUS"; exit 1 ;;
            esac
            sleep 15
          done
          test "${STATE:-}" = COMPLETED || { echo "Jules audit timed out in state ${STATE:-unknown}"; exit 1; }

          ACTIVITIES=$(curl -fsS -H "x-goog-api-key: $JULES_API_KEY" \
            "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID/activities?pageSize=100")
          REPORT=$(jq -r '[.activities[] | .agentMessaged.agentMessage? // empty] | map(select(length>0)) | last // empty' <<<"$ACTIVITIES")
          test -n "$REPORT" || { echo 'Jules completed without an agent report'; echo "$ACTIVITIES"; exit 1; }
          {
            echo '## Glee audit — all PR changes'
            echo
            echo "$REPORT"
          } > /tmp/glee-pr.md
          gh pr comment 78 --body-file /tmp/glee-pr.md

  audit-entire-repository:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Jules Glee audit — entire repository
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}" || { echo 'JULES_API_KEY secret is not configured'; exit 1; }

          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          SOURCE=''
          PAGE_TOKEN=''
          while :; do
            URL='https://jules.googleapis.com/v1alpha/sources?pageSize=100'
            if [ -n "$PAGE_TOKEN" ]; then
              URL="$URL&pageToken=$(jq -rn --arg v "$PAGE_TOKEN" '$v|@uri')"
            fi
            PAGE=$(curl -fsS -H "x-goog-api-key: $JULES_API_KEY" "$URL")
            SOURCE=$(jq -r --arg owner "$OWNER" --arg repo "$NAME" '[.sources[]? | select((.githubRepo.owner|ascii_downcase)==($owner|ascii_downcase) and (.githubRepo.repo|ascii_downcase)==($repo|ascii_downcase)) | .name][0] // empty' <<<"$PAGE")
            [ -n "$SOURCE" ] && break
            PAGE_TOKEN=$(jq -r '.nextPageToken // empty' <<<"$PAGE")
            [ -z "$PAGE_TOKEN" ] && break
          done
          test -n "$SOURCE" || { echo "Jules source not found for $REPO after scanning all connected sources"; exit 1; }

          cat > /tmp/prompt.txt <<'PROMPT'
          You are Glee, an adversarial software auditor. Audit the ENTIRE Illumera repository on this branch, not merely the current pull-request diff. Do not modify files, do not create commits or pull requests, and do not report cosmetic/style-only issues. Follow data and control flow across the repository and inspect callers before reporting a claim.

          Prioritize concrete production-impacting defects: correctness and crash paths; Android lifecycle, coroutine, Flow, Compose state/focus/input problems; profile isolation; Room schema/migration/data-loss issues; playback and ExoPlayer state; source parsing/filtering/ranking/fallback; series progress/resume/next-up; Trakt authentication/sync/history/collection behavior; queue/watchlist consistency; network/error handling; security/privacy; resource/performance leaks; and critical missing tests.

          Return ONLY a prioritized concise audit report. For every finding provide severity (Critical/High/Medium/Low), file and line or symbol, a concrete failure scenario, why it happens, and the smallest sensible fix direction. If no finding survives scrutiny, say that plainly. This is an audit only: make no code changes.
          PROMPT

          PAYLOAD=$(jq -n \
            --arg prompt "$(cat /tmp/prompt.txt)" \
            --arg title 'Glee audit — entire repository' \
            --arg source "$SOURCE" \
            --arg branch "$BRANCH" \
            '{prompt:$prompt,title:$title,sourceContext:{source:$source,githubRepoContext:{startingBranch:$branch}},requirePlanApproval:false}')

          SESSION_JSON=$(curl -fsS -X POST \
            -H "x-goog-api-key: $JULES_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            'https://jules.googleapis.com/v1alpha/sessions')
          SESSION_NAME=$(jq -r '.name' <<<"$SESSION_JSON")
          SESSION_ID=${SESSION_NAME#sessions/}
          echo "Jules session: $(jq -r '.url // empty' <<<"$SESSION_JSON")"

          for i in $(seq 1 120); do
            STATUS=$(curl -fsS -H "x-goog-api-key: $JULES_API_KEY" \
              "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID")
            STATE=$(jq -r '.state' <<<"$STATUS")
            case "$STATE" in
              COMPLETED) break ;;
              FAILED) echo "$STATUS"; exit 1 ;;
              AWAITING_USER_FEEDBACK) echo 'Jules requested user feedback unexpectedly'; echo "$STATUS"; exit 1 ;;
            esac
            sleep 15
          done
          test "${STATE:-}" = COMPLETED || { echo "Jules audit timed out in state ${STATE:-unknown}"; exit 1; }

          ACTIVITIES=$(curl -fsS -H "x-goog-api-key: $JULES_API_KEY" \
            "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID/activities?pageSize=100")
          REPORT=$(jq -r '[.activities[] | .agentMessaged.agentMessage? // empty] | map(select(length>0)) | last // empty' <<<"$ACTIVITIES")
          test -n "$REPORT" || { echo 'Jules completed without an agent report'; echo "$ACTIVITIES"; exit 1; }
          {
            echo '## Glee audit — entire repository'
            echo
            echo "$REPORT"
          } > /tmp/glee-repo.md
          gh pr comment 78 --body-file /tmp/glee-repo.md
