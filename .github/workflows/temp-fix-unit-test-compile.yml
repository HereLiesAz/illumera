name: Temporary unit-test compile repair

on:
  push:
    paths:
      - '.github/workflows/temp-fix-unit-test-compile.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact test-source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          dao_path = Path('app/src/test/java/com/hereliesaz/illumera/data/local/AddonDaoIntegrationTest.kt')
          dao = dao_path.read_text()
          old_import = 'import org.robolectric.RuntimeEnvironment\n'
          old_call = 'val context = RuntimeEnvironment.getApplication<android.app.Application>()'
          if dao.count(old_import) != 1:
              raise SystemExit(f'Expected one RuntimeEnvironment import in AddonDaoIntegrationTest, found {dao.count(old_import)}')
          if dao.count(old_call) != 1:
              raise SystemExit(f'Expected one RuntimeEnvironment application call in AddonDaoIntegrationTest, found {dao.count(old_call)}')
          dao = dao.replace('import androidx.room.Room\n', 'import androidx.room.Room\nimport androidx.test.core.app.ApplicationProvider\n', 1)
          dao = dao.replace(old_import, '', 1)
          dao = dao.replace(old_call, 'val context = ApplicationProvider.getApplicationContext<Context>()', 1)
          dao_path.write_text(dao)

          update_path = Path('app/src/test/java/com/hereliesaz/illumera/data/update/AppUpdateManagerSecurityTest.kt')
          update = update_path.read_text()
          old_call = 'RuntimeEnvironment.getApplication<android.app.Application>()'
          if update.count('import org.robolectric.RuntimeEnvironment\n') != 1:
              raise SystemExit('Expected one RuntimeEnvironment import in AppUpdateManagerSecurityTest')
          if update.count(old_call) != 3:
              raise SystemExit(f'Expected three RuntimeEnvironment application calls, found {update.count(old_call)}')
          update = update.replace('import android.content.Context\n', 'import android.content.Context\nimport androidx.test.core.app.ApplicationProvider\n', 1)
          update = update.replace('import org.robolectric.RuntimeEnvironment\n', '', 1)
          update = update.replace(old_call, 'ApplicationProvider.getApplicationContext<Context>()')
          update_path.write_text(update)

          stremio_path = Path('app/src/test/java/com/hereliesaz/illumera/ui/addons/StremioAddonsViewModelTest.kt')
          stremio = stremio_path.read_text()
          obsolete_import = 'import io.mockk.secondArg\n'
          if stremio.count(obsolete_import) != 1:
              raise SystemExit(f'Expected one obsolete secondArg import, found {stremio.count(obsolete_import)}')
          stremio = stremio.replace(obsolete_import, '', 1)
          stremio_path.write_text(stremio)
          PY

          test "$(grep -c 'ApplicationProvider.getApplicationContext<Context>()' app/src/test/java/com/hereliesaz/illumera/data/local/AddonDaoIntegrationTest.kt)" -eq 1
          test "$(grep -c 'ApplicationProvider.getApplicationContext<Context>()' app/src/test/java/com/hereliesaz/illumera/data/update/AppUpdateManagerSecurityTest.kt)" -eq 3
          ! grep -q '^import io.mockk.secondArg$' app/src/test/java/com/hereliesaz/illumera/ui/addons/StremioAddonsViewModelTest.kt

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-fix-unit-test-compile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/test/java/com/hereliesaz/illumera/data/local/AddonDaoIntegrationTest.kt \
                  app/src/test/java/com/hereliesaz/illumera/data/update/AppUpdateManagerSecurityTest.kt \
                  app/src/test/java/com/hereliesaz/illumera/ui/addons/StremioAddonsViewModelTest.kt \
                  .github/workflows/temp-fix-unit-test-compile.yml
          git diff --cached --check
          git commit -m 'Fix unit-test compilation after Kotlin upgrade'
          git push origin HEAD:main
