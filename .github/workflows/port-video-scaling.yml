name: Port video scaling modes

on:
  push:
    branches:
      - feature/video-scaling-modes
    paths:
      - .github/workflows/port-video-scaling.yml

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Port LumeraX scaling modes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1))

          models = Path("app/src/main/java/com/hereliesaz/illumera/ui/player/base/PlayerModels.kt")
          replace_once(
              models,
              "    val selectedSubtitleTrackId: String? = null,\n    val subtitleVerticalOffsetPercent: Int = 0,",
              "    val selectedSubtitleTrackId: String? = null,\n    val resizeMode: Int = 0,\n    val subtitleVerticalOffsetPercent: Int = 0,"
          )

          backend_api = Path("app/src/main/java/com/hereliesaz/illumera/ui/player/base/PlayerBackend.kt")
          replace_once(
              backend_api,
              "    fun setSubtitleBackgroundColor(color: Int)\n\n    fun release()",
              "    fun setSubtitleBackgroundColor(color: Int)\n\n    fun setResizeMode(mode: Int)\n\n    fun release()"
          )

          exo = Path("app/src/main/java/com/hereliesaz/illumera/ui/player/base/ExoPlayerBackend.kt")
          replace_once(
              exo,
              "    override fun setSubtitleBackgroundColor(color: Int) {\n        if (released) return\n        subtitleBackgroundColor = color\n        _uiState.update { it.copy(subtitleBackgroundColor = color) }\n        playerView?.let { applySubtitleCaptionStyle(it) }\n    }",
              "    override fun setSubtitleBackgroundColor(color: Int) {\n        if (released) return\n        subtitleBackgroundColor = color\n        _uiState.update { it.copy(subtitleBackgroundColor = color) }\n        playerView?.let { applySubtitleCaptionStyle(it) }\n    }\n\n    override fun setResizeMode(mode: Int) {\n        if (released) return\n        val normalizedMode = if (mode in 0..5) mode else 0\n        _uiState.update { it.copy(resizeMode = normalizedMode) }\n        playerView?.let { applyVideoResizeMode(it, normalizedMode) }\n    }"
          )

          replace_once(
              exo,
              "                        pv.keepScreenOn = player?.isPlaying == true\n                        applySubtitleOffset(pv, currentUiState.subtitleVerticalOffsetPercent)",
              "                        pv.keepScreenOn = player?.isPlaying == true\n                        applyVideoResizeMode(pv, currentUiState.resizeMode)\n                        applySubtitleOffset(pv, currentUiState.subtitleVerticalOffsetPercent)"
          )

          marker = "    private fun applySubtitleCaptionStyle(pv: PlayerView) {"
          helper = '''    private fun applyVideoResizeMode(pv: PlayerView, mode: Int) {\n        val encodedZoom = mode == 5\n        pv.resizeMode = if (encodedZoom) 0 else mode\n\n        val contentFrame = pv.findViewById<android.view.View>(androidx.media3.ui.R.id.exo_content_frame)\n        val targetView = contentFrame ?: (pv.videoSurfaceView as? android.view.View)\n        val scale = if (encodedZoom) 1.34f else 1.0f\n        if (targetView != null && (targetView.scaleX != scale || targetView.scaleY != scale)) {\n            targetView.scaleX = scale\n            targetView.scaleY = scale\n            targetView.requestLayout()\n            targetView.invalidate()\n        }\n    }\n\n'''
          text = exo.read_text()
          if helper not in text:
              if marker not in text:
                  raise SystemExit("Could not find subtitle caption helper insertion point")
              exo.write_text(text.replace(marker, helper + marker, 1))

          scaffold = Path("app/src/main/java/com/hereliesaz/illumera/ui/player/base/BasePlayerScaffold.kt")
          replace_once(
              scaffold,
              "import androidx.compose.material.icons.filled.Check\nimport androidx.compose.material.icons.filled.ClosedCaption",
              "import androidx.compose.material.icons.filled.Check\nimport androidx.compose.material.icons.filled.AspectRatio\nimport androidx.compose.material.icons.filled.ClosedCaption"
          )

          replace_once(
              scaffold,
              "                onShowSubtitlePanel = {\n                    markInteraction()\n                    activePanel = PlayerPanel.SUBTITLES\n                    showControls = true\n                    showSeekOverlay = false\n                },\n                showEpisodesControl = episodes.isNotEmpty() && onEpisodeSelected != null,",
              "                onShowSubtitlePanel = {\n                    markInteraction()\n                    activePanel = PlayerPanel.SUBTITLES\n                    showControls = true\n                    showSeekOverlay = false\n                },\n                onToggleResizeMode = {\n                    markInteraction()\n                    val nextMode = when (uiState.resizeMode) {\n                        0 -> 4 // Fit -> Zoom\n                        4 -> 3 // Zoom -> Fill\n                        3 -> 5 // Fill -> Encoded Zoom\n                        else -> 0 // Encoded Zoom -> Fit\n                    }\n                    playbackController.setResizeMode(nextMode)\n                    showControlsTemporarily()\n                },\n                showEpisodesControl = episodes.isNotEmpty() && onEpisodeSelected != null,"
          )

          replace_once(
              scaffold,
              "    onShowAudioPanel: () -> Unit,\n    onShowSubtitlePanel: () -> Unit,\n    showEpisodesControl: Boolean = false,",
              "    onShowAudioPanel: () -> Unit,\n    onShowSubtitlePanel: () -> Unit,\n    onToggleResizeMode: () -> Unit,\n    showEpisodesControl: Boolean = false,"
          )

          replace_once(
              scaffold,
              "                    if (showSourceControl || showAudioControl || showSubtitleControl) {\n                        ControlButton(",
              "                    ControlButton(\n                        icon = Icons.Default.AspectRatio,\n                        contentDescription = \"Aspect Ratio / Resize Mode\",\n                        onClick = onToggleResizeMode,\n                        onFocused = onResetHideTimer,\n                        buttonSize = 44.dp,\n                        iconSize = 18.dp\n                    )\n\n                    if (showSourceControl || showAudioControl || showSubtitleControl) {\n                        ControlButton("
          )
          PY

      - name: Commit ported player changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/hereliesaz/illumera/ui/player/base/PlayerModels.kt \
                  app/src/main/java/com/hereliesaz/illumera/ui/player/base/PlayerBackend.kt \
                  app/src/main/java/com/hereliesaz/illumera/ui/player/base/ExoPlayerBackend.kt \
                  app/src/main/java/com/hereliesaz/illumera/ui/player/base/BasePlayerScaffold.kt
          git diff --cached --check
          git commit -m "Port LumeraX video scaling modes"
          git push origin HEAD:feature/video-scaling-modes
