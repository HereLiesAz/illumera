name: Apply source filter patch

on:
  push:
    branches:
      - fix/source-language-seedless-watchlist-nav

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-language-seedless-watchlist-nav
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply patch
        run: python3 .ci/apply-source-filter-patch.py
      - name: Compile app
        run: ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Commit patch
        run: |
          rm -f .github/workflows/patch-source-language-filters.yml
          rm -f .github/workflows/patch-source-language-filters-v2.yml
          rm -f .ci/apply-source-filter-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add source language filters and fix watchlist drawer exit"
          git push origin HEAD:fix/source-language-seedless-watchlist-nav
