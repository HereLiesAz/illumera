name: Port menu visibility settings

on:
  push:
    branches:
      - feature/menu-visibility
    paths:
      - .github/workflows/port-menu-visibility.yml

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Port menu visibility settings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1))

          # Profile fields
          replace_once(
              "app/src/main/java/com/hereliesaz/illumera/data/model/ProfileEntity.kt",
              '    val splashEnabled: Boolean = true,\n\n    val homeTabLayout: String = "cinematic",',
              '    val splashEnabled: Boolean = true,\n\n    // Optional top-level navigation entries. Home and Search always remain available.\n    val menuMoviesEnabled: Boolean = true,\n    val menuSeriesEnabled: Boolean = true,\n    val menuWatchlistEnabled: Boolean = true,\n\n    val homeTabLayout: String = "cinematic",'
          )

          # Database version
          replace_once(
              "app/src/main/java/com/hereliesaz/illumera/data/local/LumeraDatabase.kt",
              '    version = 46',
              '    version = 47'
          )

          # Migration 46 -> 47 and registration
          db = Path("app/src/main/java/com/hereliesaz/illumera/di/DatabaseModule.kt")
          migration = '''\nprivate val MIGRATION_46_47 = object : Migration(46, 47) {\n    override fun migrate(db: SupportSQLiteDatabase) {\n        db.execSQL("ALTER TABLE profiles ADD COLUMN menuMoviesEnabled INTEGER NOT NULL DEFAULT 1")\n        db.execSQL("ALTER TABLE profiles ADD COLUMN menuSeriesEnabled INTEGER NOT NULL DEFAULT 1")\n        db.execSQL("ALTER TABLE profiles ADD COLUMN menuWatchlistEnabled INTEGER NOT NULL DEFAULT 1")\n    }\n}\n'''
          text = db.read_text()
          marker = '\n@Module\n@InstallIn(SingletonComponent::class)\nobject DatabaseModule {'
          if 'MIGRATION_46_47' not in text:
              if marker not in text:
                  raise SystemExit('Database module insertion marker missing')
              text = text.replace(marker, migration + marker, 1)
          text = text.replace('MIGRATION_44_45, MIGRATION_45_46)', 'MIGRATION_44_45, MIGRATION_45_46, MIGRATION_46_47)', 1)
          db.write_text(text)

          # Settings view-model mutations
          vm = Path("app/src/main/java/com/hereliesaz/illumera/ui/settings/SettingsViewModel.kt")
          text = vm.read_text()
          insert = '''\n    fun updateMenuMoviesEnabled(profileId: Int, enabled: Boolean) {\n        viewModelScope.launch(Dispatchers.IO + NonCancellable) {\n            dao.getProfileById(profileId)?.let { dao.insertProfile(it.copy(menuMoviesEnabled = enabled)) }\n        }\n    }\n\n    fun updateMenuSeriesEnabled(profileId: Int, enabled: Boolean) {\n        viewModelScope.launch(Dispatchers.IO + NonCancellable) {\n            dao.getProfileById(profileId)?.let { dao.insertProfile(it.copy(menuSeriesEnabled = enabled)) }\n        }\n    }\n\n    fun updateMenuWatchlistEnabled(profileId: Int, enabled: Boolean) {\n        viewModelScope.launch(Dispatchers.IO + NonCancellable) {\n            dao.getProfileById(profileId)?.let { dao.insertProfile(it.copy(menuWatchlistEnabled = enabled)) }\n        }\n    }\n'''
          if 'fun updateMenuMoviesEnabled' not in text:
              idx = text.rfind('\n}')
              if idx < 0:
                  raise SystemExit('SettingsViewModel closing brace missing')
              text = text[:idx] + insert + text[idx:]
              vm.write_text(text)

          # Personalization controls
          settings = Path("app/src/main/java/com/hereliesaz/illumera/ui/settings/SettingsSubScreens.kt")
          text = settings.read_text()
          old = '''        // SPLASH SCREEN\n        SettingRow("Splash Screen") {\n            VoidSegmentedControl(\n                options = listOf("On" to true, "Off" to false),\n                selectedOption = currentProfile.splashEnabled,\n                onOptionSelected = { viewModel.updateSplashEnabled(currentProfile.id, it) },\n                onBack = onGoBack,\n                blockUp = false\n            )\n        }\n'''
          new = old + '''\n        Spacer(Modifier.height(15.dp))\n        Box(modifier = Modifier.fillMaxWidth().height(1.dp).background(Color.White.copy(0.1f)))\n        Spacer(Modifier.height(15.dp))\n\n        Text(\n            "Navigation",\n            style = MaterialTheme.typography.titleSmall.copy(fontWeight = FontWeight.SemiBold, fontSize = 16.sp),\n            color = Color.White.copy(0.7f),\n            modifier = Modifier.padding(bottom = 8.dp)\n        )\n\n        SettingToggleRow(\n            label = "Movies",\n            subtitle = "Show Movies in the main navigation",\n            isChecked = currentProfile.menuMoviesEnabled,\n            onCheckedChange = { viewModel.updateMenuMoviesEnabled(currentProfile.id, it) },\n            onBack = onGoBack\n        )\n        SettingToggleRow(\n            label = "Series",\n            subtitle = "Show Series in the main navigation",\n            isChecked = currentProfile.menuSeriesEnabled,\n            onCheckedChange = { viewModel.updateMenuSeriesEnabled(currentProfile.id, it) },\n            onBack = onGoBack\n        )\n        SettingToggleRow(\n            label = "Watchlist",\n            subtitle = "Show Watchlist in the main navigation",\n            isChecked = currentProfile.menuWatchlistEnabled,\n            onCheckedChange = { viewModel.updateMenuWatchlistEnabled(currentProfile.id, it) },\n            onBack = onGoBack\n        )\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('Personalization splash block missing')
              settings.write_text(text.replace(old, new, 1))

          # Left drawer filtering
          drawer = Path("app/src/main/java/com/hereliesaz/illumera/ui/navigation/NavDrawer.kt")
          text = drawer.read_text()
          old = '''                DrawerItem(NavDestination.Home)\n                Spacer(modifier = Modifier.height(4.dp))\n                DrawerItem(NavDestination.Movies)\n                Spacer(modifier = Modifier.height(4.dp))\n                DrawerItem(NavDestination.Series)\n                Spacer(modifier = Modifier.height(4.dp))\n                DrawerItem(NavDestination.Watchlist)\n'''
          new = '''                DrawerItem(NavDestination.Home)\n                if (currentProfile?.menuMoviesEnabled != false) {\n                    Spacer(modifier = Modifier.height(4.dp))\n                    DrawerItem(NavDestination.Movies)\n                }\n                if (currentProfile?.menuSeriesEnabled != false) {\n                    Spacer(modifier = Modifier.height(4.dp))\n                    DrawerItem(NavDestination.Series)\n                }\n                if (currentProfile?.menuWatchlistEnabled != false) {\n                    Spacer(modifier = Modifier.height(4.dp))\n                    DrawerItem(NavDestination.Watchlist)\n                }\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('NavDrawer middle-items block missing')
              drawer.write_text(text.replace(old, new, 1))

          # Top navigation filtering while preserving Search + Home.
          top = Path("app/src/main/java/com/hereliesaz/illumera/ui/navigation/TopNavigationBar.kt")
          text = top.read_text()
          old = '''    val centerItems = listOf(\n        NavDestination.Search,\n        NavDestination.Home,\n        NavDestination.Movies,\n        NavDestination.Series,\n        NavDestination.Watchlist\n    )\n'''
          new = '''    val centerItems = buildList {\n        add(NavDestination.Search)\n        add(NavDestination.Home)\n        if (currentProfile?.menuMoviesEnabled != false) add(NavDestination.Movies)\n        if (currentProfile?.menuSeriesEnabled != false) add(NavDestination.Series)\n        if (currentProfile?.menuWatchlistEnabled != false) add(NavDestination.Watchlist)\n    }\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('TopNavigationBar centerItems block missing')
              top.write_text(text.replace(old, new, 1))
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/hereliesaz/illumera/data/model/ProfileEntity.kt \
                  app/src/main/java/com/hereliesaz/illumera/data/local/LumeraDatabase.kt \
                  app/src/main/java/com/hereliesaz/illumera/di/DatabaseModule.kt \
                  app/src/main/java/com/hereliesaz/illumera/ui/settings/SettingsViewModel.kt \
                  app/src/main/java/com/hereliesaz/illumera/ui/settings/SettingsSubScreens.kt \
                  app/src/main/java/com/hereliesaz/illumera/ui/navigation/NavDrawer.kt \
                  app/src/main/java/com/hereliesaz/illumera/ui/navigation/TopNavigationBar.kt
          git diff --cached --check
          git commit -m "Add per-profile navigation visibility settings"
          git push origin HEAD:feature/menu-visibility
