name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  STREMIO_MEDIA_REF: 95781597c8e3c30d6232e77bdadecc38ad35aa17
  STREMIO_AAR_CACHE_VERSION: v2

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout illumera
        uses: actions/checkout@v4
        with:
          path: illumera
          fetch-depth: 0

      - name: Validate release credentials
        env:
          KEYSTORE_RAW: ${{ secrets.KEYSTORE_RAW }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_RAW KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done

      - name: Restore Stremio playback AAR cache
        id: stremio-cache
        uses: actions/cache@v4
        with:
          path: stremio-aars
          key: stremio-media-${{ runner.os }}-${{ env.STREMIO_MEDIA_REF }}-${{ env.STREMIO_AAR_CACHE_VERSION }}

      - name: Checkout Stremio Media3 fork
        if: steps.stremio-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: Stremio/media
          ref: ${{ env.STREMIO_MEDIA_REF }}
          path: stremio-media
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Stremio playback modules
        if: steps.stremio-cache.outputs.cache-hit != 'true'
        working-directory: illumera
        run: |
          chmod +x ci/build-stremio-media.sh
          ./ci/build-stremio-media.sh ../stremio-media ../stremio-aars

      - name: Install Stremio playback modules
        working-directory: illumera
        run: |
          set -euo pipefail
          for aar in \
            lib-exoplayer-release.aar \
            lib-decoder-av1-release.aar \
            lib-decoder-ffmpeg-release.aar \
            lib-decoder-iamf-release.aar \
            lib-decoder-mpegh-release.aar; do
            test -s "../stremio-aars/$aar"
            cp "../stremio-aars/$aar" "playbackcore/libs/$aar"
          done

      - name: Resolve version
        id: version
        working-directory: illumera
        run: |
          set -euo pipefail
          BASE=$(grep -oP 'versionName = \(project\.findProperty\("versionNameOverride"\) as String\?\)\?\.toString\(\) \?: "\K[^"]+|versionName = \(project\.findProperty\("versionNameOverride"\) as String\?\) \?: "\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$BASE" ]; then
            BASE=$(grep -oP 'versionName\s*=.*?:\s*"\K[^"]+' app/build.gradle.kts | head -1)
          fi
          MAJOR_MINOR=$(echo "$BASE" | grep -oP '^\d+\.\d+')
          test -n "$MAJOR_MINOR"
          echo "name=${MAJOR_MINOR}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "tag=v${MAJOR_MINOR}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        working-directory: illumera
        run: echo "${{ secrets.KEYSTORE_RAW }}" | base64 -d > release.keystore

      - name: Build signed APK and AAB
        working-directory: illumera
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          ACRA_URL: ${{ secrets.ACRA_URL }}
          ACRA_TOKEN: ${{ secrets.ACRA_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon \
            -PversionNameOverride="${{ steps.version.outputs.name }}" \
            -PversionCodeOverride="${{ steps.version.outputs.code }}"

      - name: Locate release artifacts
        id: artifacts
        working-directory: illumera
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -1)
          AAB=$(find app/build/outputs/bundle/release -maxdepth 1 -name "*.aab" | head -1)
          test -n "$APK" && test -n "$AAB"
          APK_NAME="illumera-${{ steps.version.outputs.name }}.apk"
          cp "$APK" "$APK_NAME"
          echo "apk=illumera/$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "aab=illumera/$AAB" >> "$GITHUB_OUTPUT"

      - name: Compute APK SHA-256
        id: checksum
        run: echo "hash=$(sha256sum '${{ steps.artifacts.outputs.apk }}' | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish AAB to Internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hereliesaz.illumera
          releaseFiles: ${{ steps.artifacts.outputs.aab }}
          track: internal
          status: completed

      - name: Create Alpha draft
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: com.hereliesaz.illumera
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          python -m pip install --quiet google-auth requests
          python - <<'PY'
          import json
          import os
          import requests
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          package_name = os.environ["PACKAGE_NAME"]
          version_code = os.environ["VERSION_CODE"]
          version_name = os.environ["VERSION_NAME"]
          info = json.loads(os.environ["PLAY_SERVICE_ACCOUNT_JSON"])
          credentials = service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          credentials.refresh(Request())
          headers = {
              "Authorization": f"Bearer {credentials.token}",
              "Content-Type": "application/json",
          }
          base = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{package_name}"

          response = requests.post(f"{base}/edits", headers=headers, json={})
          response.raise_for_status()
          edit_id = response.json()["id"]
          track_url = f"{base}/edits/{edit_id}/tracks/alpha"

          response = requests.get(track_url, headers=headers)
          if response.status_code == 404:
              releases = []
          else:
              response.raise_for_status()
              releases = response.json().get("releases", [])

          releases = [
              release for release in releases
              if release.get("status") != "draft"
              and version_code not in [str(code) for code in release.get("versionCodes", [])]
          ]
          releases.append({
              "name": f"illumera {version_name}",
              "versionCodes": [version_code],
              "status": "draft",
          })

          response = requests.put(
              track_url,
              headers=headers,
              json={"track": "alpha", "releases": releases},
          )
          response.raise_for_status()
          response = requests.post(f"{base}/edits/{edit_id}:commit", headers=headers, json={})
          response.raise_for_status()
          PY

      - name: Generate changelog
        id: changelog
        working-directory: illumera
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "log<<EOF"
            if [ -n "$PREV_TAG" ]; then
              git log "$PREV_TAG..HEAD" --pretty="format:- %s" --no-merges
            else
              echo "- Initial release"
            fi
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: illumera ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ steps.artifacts.outputs.apk }}
          body: |
            ## Changes
            ${{ steps.changelog.outputs.log }}

            ---
            SHA-256: ${{ steps.checksum.outputs.hash }}
